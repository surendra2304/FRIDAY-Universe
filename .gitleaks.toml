# Gitleaks allowlist — false positive in Sentinel evidence docs.
# TASK-SEN-039 (PR #2161): docs/collaboration/TASK-SEN-039-CHECKPOINT-3.md
# line 20 quotes classifier dry-run output text ("rotate sentinel API key in
# production" action name + "credential_change, hard_bound=True" flags).
# That text is prose, not a credential. Allowlisted verbatim so no real
# secret shape is masked. Verified locally with gitleaks 8.30.1 (the CI
# version): the allowlist clears the 1 finding and a JWT control is still
# flagged, so default rules stay active via [extend] useDefault.
[extend]
useDefault = true

[allowlist]
description = "Sentinel classifier-output prose in evidence docs (TASK-SEN-039 false positive)."
regexes = [
  '''hard_bound=True''',
]
