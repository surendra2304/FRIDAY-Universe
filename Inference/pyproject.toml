[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Inference"
version = "2.0.0"
description = "Local-first, provider-agnostic multi-agent intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Surendra", email = "surendra@example.com" }
]
# TASK-SEN-012 (2026-11-15): fleet-shared floors reconciled with SEN-002's live-venv probe; see docs/DEPENDENCY_LOCKS.md.
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.28",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10,<2.0",
    # Test-only: SQLiteMemory is never selected by the runtime factory.
    "aiosqlite>=0.20.0"
]
litellm = [
    "litellm>=1.40.0,<2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "diary*", "docs*", "scripts*", "tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
# Single source of truth for pytest configuration. Historically a separate
# pytest.ini existed alongside this section; pytest emits
# "WARNING: ignoring pytest config in pyproject.toml!" and silently drops
# asyncio_mode/addopts when it does. Merging them makes asyncio_mode="auto"
# actually take effect.
addopts = "-ra -q -p no:fugue_test -p no:fugue_test_fixtures"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

