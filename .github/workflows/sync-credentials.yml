name: Sync Credentials to Oracle Cloud

# Owner directive (2026-11-11): store the Telegram bot credentials in
# credentials.md ON THE ORACLE CLOUD SERVERS. The repo is PUBLIC, so the
# tokens live ONLY in GitHub Secrets (never in repo content — see H5
# "Secrets purged from history" and secret-scan.yml) and are written to
# the VMs over SSH by this workflow, using the same ORACLE_SSH_KEY the
# deploy workflow already trusts.
#
# What it does, on BOTH servers, in /opt/friday_universe:
#   1. Backs up any existing credentials.md (credentials.md.bak-<ts>)
#   2. Writes credentials.md (chmod 600) with the Telegram bot credentials
#   3. Adds missing TELEGRAM_* keys to .env / Stratex/.env (never overwrites
#      existing values — the live services keep whatever already works)
#   4. Does NOT restart any service (credentials land on next natural deploy)

on:
  workflow_dispatch:

jobs:
  sync-credentials-server1:
    name: Write credentials.md on Server 1
    runs-on: ubuntu-latest
    steps:
      - name: Write credentials on Server 1
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER1_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /opt/friday_universe

            # 1. Rotate any existing credentials.md (never destroy owner data)
            if [ -f credentials.md ]; then
              cp credentials.md "credentials.md.bak-$(date +%Y%m%d-%H%M%S)"
              echo "existing credentials.md backed up"
            fi

            # 2. Master credentials file (owner request 2026-11-11)
            cat > credentials.md << 'CREDS_EOF'
            # FRIDAY Universe — Credentials (Oracle Cloud master copy)
            # Written by the Sync Credentials workflow from GitHub Secrets.
            # NEVER commit this file — the repo is public. (gitignored)

            ## Telegram bots (owner-supplied 2026-11-11)

            - Bot 1 — zai_notifications_bot (username @zai_notifications_bot, id 9050935840)
              token: TELEGRAM_ZAI_NOTIFICATION_BOT_TOKEN
              {{ZAI_TOKEN}}

            - Bot 2 — FRIDAY Universe bot (username @fridayuniverse_bot, id 9179067933)
              token: TELEGRAM_BOT_TOKEN
              {{FRIDAY_TOKEN}}

            - Owner chat id (surendra2304): {{CHAT_ID}}

            ## Notes
            - TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID are the standard env pair every
              service reads (Stratex notifications, notify_turn_complete.py, Sentinel
              approval dispatcher).
            - The FRIDAY Universe bot is the verified-sending notification channel
              (owner chat started 2026-11-11).
            CREDS_EOF
            sed -i "s|{{ZAI_TOKEN}}|${{ secrets.TELEGRAM_ZAI_NOTIFICATION_BOT_TOKEN }}|" credentials.md
            sed -i "s|{{FRIDAY_TOKEN}}|${{ secrets.TELEGRAM_BOT_TOKEN }}|" credentials.md
            sed -i "s|{{CHAT_ID}}|${{ secrets.TELEGRAM_CHAT_ID }}|" credentials.md
            chmod 600 credentials.md
            echo "credentials.md written"

            # 3. Add-if-missing env keys (preserve anything already configured)
            ensure_env_key() {
              file="$1"; key="$2"; val="$3"
              touch "$file"
              if ! grep -qE "^${key}=" "$file"; then
                printf '%s=%s\n' "$key" "$val" >> "$file"
                echo "added ${key} to ${file}"
              else
                echo "${key} already present in ${file} (kept)"
              fi
            }
            ensure_env_key /opt/friday_universe/.env TELEGRAM_BOT_TOKEN '${{ secrets.TELEGRAM_BOT_TOKEN }}'
            ensure_env_key /opt/friday_universe/.env TELEGRAM_ZAI_NOTIFICATION_BOT_TOKEN '${{ secrets.TELEGRAM_ZAI_NOTIFICATION_BOT_TOKEN }}'
            ensure_env_key /opt/friday_universe/.env TELEGRAM_CHAT_ID '${{ secrets.TELEGRAM_CHAT_ID }}'
            ensure_env_key /opt/friday_universe/Stratex/.env TELEGRAM_BOT_TOKEN '${{ secrets.TELEGRAM_BOT_TOKEN }}'
            ensure_env_key /opt/friday_universe/Stratex/.env TELEGRAM_CHAT_ID '${{ secrets.TELEGRAM_CHAT_ID }}'
            chmod 600 /opt/friday_universe/.env /opt/friday_universe/Stratex/.env 2>/dev/null || true

            echo "=== Server 1 credentials sync complete ==="
            ls -la credentials.md

  sync-credentials-server2:
    name: Write credentials.md on Server 2
    runs-on: ubuntu-latest
    steps:
      - name: Write credentials on Server 2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /opt/friday_universe

            if [ -f credentials.md ]; then
              cp credentials.md "credentials.md.bak-$(date +%Y%m%d-%H%M%S)"
            fi

            cat > credentials.md << 'CREDS_EOF'
            # FRIDAY Universe — Credentials (Oracle Cloud master copy)
            # Written by the Sync Credentials workflow from GitHub Secrets.
            # NEVER commit this file — the repo is public. (gitignored)

            ## Telegram bots (owner-supplied 2026-11-11)

            - Bot 1 — zai_notifications_bot (username @zai_notifications_bot, id 9050935840)
              token: TELEGRAM_ZAI_NOTIFICATION_BOT_TOKEN
              {{ZAI_TOKEN}}

            - Bot 2 — FRIDAY Universe bot (username @fridayuniverse_bot, id 9179067933)
              token: TELEGRAM_BOT_TOKEN
              {{FRIDAY_TOKEN}}

            - Owner chat id (surendra2304): {{CHAT_ID}}
            CREDS_EOF
            sed -i "s|{{ZAI_TOKEN}}|${{ secrets.TELEGRAM_ZAI_NOTIFICATION_BOT_TOKEN }}|" credentials.md
            sed -i "s|{{FRIDAY_TOKEN}}|${{ secrets.TELEGRAM_BOT_TOKEN }}|" credentials.md
            sed -i "s|{{CHAT_ID}}|${{ secrets.TELEGRAM_CHAT_ID }}|" credentials.md
            chmod 600 credentials.md

            ensure_env_key() {
              file="$1"; key="$2"; val="$3"
              touch "$file"
              if ! grep -qE "^${key}=" "$file"; then
                printf '%s=%s\n' "$key" "$val" >> "$file"
                echo "added ${key} to ${file}"
              else
                echo "${key} already present in ${file} (kept)"
              fi
            }
            ensure_env_key /opt/friday_universe/.env TELEGRAM_BOT_TOKEN '${{ secrets.TELEGRAM_BOT_TOKEN }}'
            ensure_env_key /opt/friday_universe/.env TELEGRAM_CHAT_ID '${{ secrets.TELEGRAM_CHAT_ID }}'
            chmod 600 /opt/friday_universe/.env 2>/dev/null || true

            echo "=== Server 2 credentials sync complete ==="
            ls -la credentials.md
