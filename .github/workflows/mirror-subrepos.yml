name: Validate Standalone Agent Subtrees (Non-Destructive)

on:
  workflow_dispatch:

# This repository preserves independent histories for the standalone agents.
# Validate subtree extraction only. Never push to a standalone repository or
# rewrite its main branch from this monorepo.
permissions:
  contents: read

jobs:
  validate-subtrees:
    name: Validate agent subtree extraction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate all agent roots
        shell: bash
        run: |
          set -Eeuo pipefail
          AGENTS=("FRIDAY" "Inference" "Memora" "Stratex" "IntelX" "Futuris" "Forge" "VyralX" "Sentinel" "Cortex")
          failures=0

          for AGENT in "${AGENTS[@]}"; do
            echo "::group::Validating ${AGENT}"
            if [[ ! -d "${AGENT}" ]]; then
              echo "::error title=Missing agent root::Required directory ${AGENT}/ is missing"
              failures=$((failures + 1))
            elif ! git ls-files --error-unmatch "${AGENT}" >/dev/null 2>&1; then
              echo "::error title=Untracked agent root::No tracked files found for ${AGENT}/"
              failures=$((failures + 1))
            elif ! git subtree split --prefix="${AGENT}" HEAD >/dev/null; then
              echo "::error title=Subtree split failed::Could not split ${AGENT}/ from HEAD"
              failures=$((failures + 1))
            else
              echo "Validated ${AGENT}/"
            fi
            echo "::endgroup::"
          done

          if (( failures > 0 )); then
            echo "::error::${failures} agent subtree validation(s) failed"
            exit 1
          fi
          echo "All agent roots validated. No remote repositories were modified."
