name: Standalone Repository Mirror (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-op:
    name: Confirm monorepo-only mode
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain the no-op
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Cross-repository mirroring is disabled."
          echo "This workflow does not check out, synchronize, push to, or open pull requests in other repositories."
