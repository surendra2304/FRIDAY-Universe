name: Subtree Mirror (manual dry run, monorepo-only policy)

# Monorepo-only policy: this workflow never writes to the standalone agent repositories.
# Run it by hand to confirm that every agent folder still splits into a clean history.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-dry-run:
    name: Verify subtree split (no external writes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify each agent folder splits cleanly
        run: |
          set -euo pipefail
          for AGENT in FRIDAY Inference Memora Stratex Forge Cortex Sentinel IntelX Futuris VyralX; do
            sha=$(git subtree split --prefix="$AGENT")
            echo "$AGENT -> $sha ($(git rev-list --count "$sha") commits)"
          done
          echo "Dry run only: nothing was sent to any standalone repository."
