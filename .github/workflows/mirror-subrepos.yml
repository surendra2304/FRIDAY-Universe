name: Standalone Repository Mirror

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent directory to mirror
        required: true
        type: choice
        options:
          - FRIDAY
          - Cortex
          - Forge
          - Futuris
          - Inference
          - IntelX
          - Memora
          - Sentinel
          - Stratex
          - VyralX

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror ${{ matrix.agent }} via PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        agent: ["FRIDAY", "Cortex", "Forge", "Futuris", "Inference", "IntelX", "Memora", "Sentinel", "Stratex", "VyralX"]
    steps:
      - name: Filter to selected agent
        if: matrix.agent == github.event.inputs.agent
        id: filter
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- ".github/workflows/mirror-subrepos.yml"; then
            echo "target_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- "$AGENT"; then
            echo "target_changed=false" >> "$GITHUB_OUTPUT"
            echo "No files changed under $AGENT; skipping."
          else
            echo "target_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require an explicit cross-repository write token
        if: steps.filter.outputs.target_changed == 'true'
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.GH_PAT_MIRROR }}
        run: |
          set -euo pipefail
          if [[ -z "$MIRROR_TOKEN" ]]; then
            echo "::error::Set GH_PAT_MIRROR with contents-write access to all ten agent repositories."
            exit 1
          fi

      - name: Check out monorepo and standalone repository
        if: steps.filter.outputs.target_changed == 'true'
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          MIRROR_TOKEN: ${{ secrets.GH_PAT_MIRROR }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/surendra2304/FRIDAY-Universe.git" monorepo
          git clone --depth 1 "https://github.com/surendra2304/${AGENT}.git" "standalone/${AGENT}"

      - name: Stage monorepo subtree changes into a sync branch
        if: steps.filter.outputs.target_changed == 'true'
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          SOURCE_SHA: ${{ github.sha }}
          MIRROR_TOKEN: ${{ secrets.GH_PAT_MIRROR }}
        working-directory: standalone/${AGENT}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SYNC_BRANCH="sync/monorepo-${SOURCE_SHA:0:12}"
          git checkout -B "$SYNC_BRANCH" origin/main

          # Stage additions, modifications, and deletions from the monorepo
          # subtree into the standalone branch without rsync --delete or
          # direct main-branch writes. Deletions are reviewed via PR.
          git --git-dir=.git --work-tree="$GITHUB_WORKSPACE/monorepo/$AGENT" add -A -- .

          if git diff --cached --quiet; then
            echo "Standalone $AGENT is already in sync with monorepo subtree. Nothing to push."
            exit 0
          fi

          git commit -m "chore(mirror): direct sync $AGENT from monorepo ${SOURCE_SHA:0:12}"
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo "Successfully pushed latest $AGENT changes to $SYNC_BRANCH."

      - name: Open pull request for ${{ matrix.agent }}
        if: steps.filter.outputs.target_changed == 'true'
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_PAT_MIRROR }}
        working-directory: standalone/${AGENT}
        run: |
          set -euo pipefail
          SYNC_BRANCH="sync/monorepo-${SOURCE_SHA:0:12}"
          gh pr create \
            --repo surendra2304/${AGENT} \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "chore(mirror): sync $AGENT from monorepo ${SOURCE_SHA:0:12}" \
            --body "Automated mirror sync from FRIDAY Universe monorepo commit ${SOURCE_SHA}."
