name: FRIDAY Universe Fleet Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-monorepo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Analyze Changed Agents
    runs-on: ubuntu-latest
    outputs:
      server1: ${{ steps.filter.outputs.server1 }}
      server2: ${{ steps.filter.outputs.server2 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server1:
              - 'FRIDAY/**'
              - 'Inference/**'
              - 'Memora/**'
              - 'Stratex/**'
              - 'IntelX/**'
              - 'Futuris/**'
              - 'Forge/**'
              - 'mesh/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'
            server2:
              - 'VyralX/**'
              - 'Sentinel/**'
              - 'Cortex/**'
              - 'mesh/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'

  deploy-server1:
    name: Deploy Core Fleet (Server 1)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server1 == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Changed Agents on Server 1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER1_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "=== Syncing FRIDAY Universe on Server 1 (FRIDAY Universe VNIC) ==="
            cd /opt/friday_universe
            OLD_REV=$(git rev-parse HEAD 2>/dev/null || echo "HEAD~1")
            git fetch origin main
            git reset --hard origin/main
            
            CHANGED_AGENTS=$(git diff --name-only $OLD_REV HEAD 2>/dev/null | awk -F/ '{print $1}' | sort -u)
            echo "Changed folders detected: $CHANGED_AGENTS"
            
            SERVER1_AGENTS=("FRIDAY" "Inference" "Memora" "Stratex" "IntelX" "Futuris" "Forge")
            for AGENT in "${SERVER1_AGENTS[@]}"; do
              if echo "$CHANGED_AGENTS" | grep -qw "$AGENT" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                if systemctl list-unit-files | grep -qw "${AGENT}.service"; then
                  echo "=== Restarting ${AGENT}.service ==="
                  sudo systemctl restart "${AGENT}.service"
                  sudo systemctl is-active "${AGENT}.service" || echo "${AGENT} is not running"
                else
                  echo "=== ${AGENT}.service not registered yet. Code pulled cleanly. ==="
                fi
              fi
            done
            
            if echo "$CHANGED_AGENTS" | grep -qw "Stratex" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if systemctl list-unit-files | grep -qw "Stratex-Daemon.service"; then
                echo "=== Restarting Stratex-Daemon.service ==="
                sudo systemctl restart Stratex-Daemon.service
              fi
            fi

            # ── TASK-OBS-001 post-deploy health gate ─────────────────────────────
            # A unit under Restart=always can sit in a crash loop and still read
            # "active". Probe each restarted agent over HTTP and surface failures
            # in the job log instead of leaving them silent.
            echo "=== Post-deploy health gate ==="
            FAILED_HEALTH=""
            for AGENT in "${SERVER1_AGENTS[@]}"; do
              PORT=""
              case "$AGENT" in
                FRIDAY) PORT=10000;; Inference) PORT=8001;; Memora) PORT=8002;;
                Stratex) PORT=8003;; Futuris) PORT=8004;; IntelX) PORT=8005;; Forge) PORT=8006;;
              esac
              [ -n "$PORT" ] || continue
              OK=""
              for i in $(seq 1 12); do
                if curl -sf -m 5 "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then OK=yes; break; fi
                sleep 5
              done
              if [ "$OK" = "yes" ]; then
                RESTARTS=$(systemctl show "$AGENT.service" --property=NRestarts --value)
                echo "    $AGENT: healthy (NRestarts=$RESTARTS)"
                if [ "${RESTARTS:-0}" -gt 3 ]; then
                  echo "    ::warning::$AGENT restarted ${RESTARTS}x since boot — possible crash loop"
                fi
              else
                STATUS=$(systemctl is-active "$AGENT.service" || true)
                echo "    ::error::$AGENT UNHEALTHY after deploy (systemd: $STATUS)"
                FAILED_HEALTH="$FAILED_HEALTH $AGENT"
              fi
            done
            if [ -n "$FAILED_HEALTH" ]; then
              echo "::error::Deploy completed but health gate failed for:$FAILED_HEALTH — run scripts/rollback_deploy.sh <last-good-sha> or the 'Fleet Rollback' workflow"
              exit 1
            fi
            echo "=== Health gate passed on Server 1 ==="

  deploy-server2:
    name: Deploy Specialist Fleet (Server 2)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server2 == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Changed Agents on Server 2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "=== Syncing FRIDAY Universe on Server 2 (FRIDAY Universe VNIC 2) ==="
            cd /opt/friday_universe
            OLD_REV=$(git rev-parse HEAD 2>/dev/null || echo "HEAD~1")
            git fetch origin main
            git reset --hard origin/main
            
            CHANGED_AGENTS=$(git diff --name-only $OLD_REV HEAD 2>/dev/null | awk -F/ '{print $1}' | sort -u)
            echo "Changed folders detected: $CHANGED_AGENTS"
            
            SERVER2_AGENTS=("VyralX" "Sentinel" "Cortex")
            for AGENT in "${SERVER2_AGENTS[@]}"; do
              if echo "$CHANGED_AGENTS" | grep -qw "$AGENT" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                if systemctl list-unit-files | grep -qw "${AGENT}.service"; then
                  echo "=== Restarting ${AGENT}.service ==="
                  sudo systemctl restart "${AGENT}.service"
                  sudo systemctl is-active "${AGENT}.service" || echo "${AGENT} is not running"
                else
                  echo "=== ${AGENT}.service not registered yet. Code pulled cleanly. ==="
                fi
              fi
            done
            
            if echo "$CHANGED_AGENTS" | grep -qw "VyralX" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if systemctl list-unit-files | grep -qw "VyralX-Daemon.service"; then
                echo "=== Restarting VyralX-Daemon.service ==="
                sudo systemctl restart VyralX-Daemon.service
              fi
            fi

            # ── TASK-OBS-001 post-deploy health gate ─────────────────────────────
            echo "=== Post-deploy health gate ==="
            FAILED_HEALTH=""
            for AGENT in "${SERVER2_AGENTS[@]}"; do
              PORT=""
              case "$AGENT" in
                Sentinel) PORT=8008;; Cortex) PORT=8009;; VyralX) PORT=8010;;
              esac
              [ -n "$PORT" ] || continue
              OK=""
              for i in $(seq 1 12); do
                if curl -sf -m 5 "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then OK=yes; break; fi
                sleep 5
              done
              if [ "$OK" = "yes" ]; then
                RESTARTS=$(systemctl show "$AGENT.service" --property=NRestarts --value)
                echo "    $AGENT: healthy (NRestarts=$RESTARTS)"
                if [ "${RESTARTS:-0}" -gt 3 ]; then
                  echo "    ::warning::$AGENT restarted ${RESTARTS}x since boot — possible crash loop"
                fi
              else
                STATUS=$(systemctl is-active "$AGENT.service" || true)
                echo "    ::error::$AGENT UNHEALTHY after deploy (systemd: $STATUS)"
                FAILED_HEALTH="$FAILED_HEALTH $AGENT"
              fi
            done
            if [ -n "$FAILED_HEALTH" ]; then
              echo "::error::Deploy completed but health gate failed for:$FAILED_HEALTH — run scripts/rollback_deploy.sh <last-good-sha> or the 'Fleet Rollback' workflow"
              exit 1
            fi
            echo "=== Health gate passed on Server 2 ==="
