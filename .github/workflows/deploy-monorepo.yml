name: FRIDAY Universe Fleet Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-monorepo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Analyze Changed Agents
    runs-on: ubuntu-latest
    outputs:
      server1: ${{ steps.filter.outputs.server1 }}
      server2: ${{ steps.filter.outputs.server2 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            server1:
              - 'FRIDAY/**'
              - 'Inference/**'
              - 'Memora/**'
              - 'Stratex/**'
              - 'IntelX/**'
              - 'Futuris/**'
              - 'Forge/**'
              - 'mesh/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'
            server2:
              - 'VyralX/**'
              - 'Sentinel/**'
              - 'Cortex/**'
              - 'mesh/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'

  deploy-server1:
    name: Deploy Core Fleet (Server 1)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server1 == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Changed Agents on Server 1
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER1_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "=== Syncing FRIDAY Universe on Server 1 (FRIDAY Universe VNIC) ==="
            cd /opt/friday_universe
            # BEGIN SAFE CHECKOUT — preserve collaborator work, pin this run.
            set -euo pipefail
            DEPLOY_REV="${{ github.sha }}"
            [[ "$DEPLOY_REV" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid deployment revision"; exit 1; }
            # BEGIN MAIN-BRANCH GUARD (TASK-OBS-005) — Fleet CD fast-forwards
            # into the CURRENT checkout and never switches branches, so a
            # checkout parked on a non-main branch can pass every other check
            # (its HEAD can be an ancestor of the deploy revision) while the
            # ff advances the WRONG branch and main stays stranded (defect
            # D9, three recurrences 2026-11-16/17). Assert main BEFORE the
            # fast-forward and fail loudly, naming the branch. This block is
            # identical in both deploy jobs and is executed by
            # tests/test_fleet_cd_branch_guard.py — keep them in sync.
            DEPLOY_BRANCH="$(git branch --show-current)"
            if [ "$DEPLOY_BRANCH" != "main" ]; then
              echo "::error::TASK-OBS-005 branch guard: /opt/friday_universe is checked out on branch '${DEPLOY_BRANCH:-<detached HEAD>}' instead of 'main' — refusing to fast-forward. Return the checkout to the main branch and re-run this deploy."
              exit 1
            fi
            echo "Branch guard (TASK-OBS-005): checkout is on 'main'; proceeding."
            # END MAIN-BRANCH GUARD (TASK-OBS-005)
            OLD_REV=$(git rev-parse HEAD)
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Tracked collaborator changes present; refusing deployment without modifying them."
              exit 1
            fi
            git fetch --no-tags origin "$DEPLOY_REV"
            git cat-file -e "$DEPLOY_REV^{commit}"
            if ! git merge-base --is-ancestor "$OLD_REV" "$DEPLOY_REV"; then
              echo "Checkout diverges from deployment revision; manual reconciliation required."
              exit 1
            fi
            # Git refuses untracked-path collisions. No clean/reset/stash, no
            # force or branch switch; preserve all local work and ancestry.
            git -c merge.autoStash=false merge --ff-only "$DEPLOY_REV"
            [ "$(git rev-parse HEAD)" = "$DEPLOY_REV" ]
            # END SAFE CHECKOUT
            
            CHANGED_AGENTS=$(git diff --name-only $OLD_REV HEAD 2>/dev/null | awk -F/ '{print $1}' | sort -u)
            echo "Changed folders detected: $CHANGED_AGENTS"

            # ── TASK-MEM-009 pre-restart migration gate ─────────────────────
            # Nothing in the deploy path ran Alembic, so on 2026-11-17 a
            # merged migration (PR #831) stayed unapplied and every Memora
            # memory path failed for ~1.5h while /health stayed green. When
            # this run will restart Memora (the same condition the restart
            # loop below uses), apply migrations FIRST, from the checkout
            # this run just pinned: a migration failure aborts the deploy
            # here, before any service restarts, with the fleet still
            # running the previous code in memory. The runner is the same
            # script the unit's ExecStartPre invokes (setup_fleet.sh); it
            # logs before/after revisions and exits non-zero on failure.
            if echo "$CHANGED_AGENTS" | grep -qw "Memora" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "$(systemctl show Memora.service --property=LoadState --value)" = loaded ]; then
                echo "=== Applying Memora database migrations (TASK-MEM-009) ==="
                MEMORA_PY=$(systemctl cat Memora.service 2>/dev/null | grep -E '^ExecStart=' | head -1 | sed 's/^ExecStart=//' | awk '{print $1}' || true)
                if [ -z "$MEMORA_PY" ] || [ "${MEMORA_PY:0:1}" = "{" ] || [ ! -x "$MEMORA_PY" ]; then
                  MEMORA_PY="/opt/friday_universe/venv/bin/python"
                fi
                if ! "$MEMORA_PY" /opt/friday_universe/Memora/scripts/run_migrations.py; then
                  echo "::error::Memora migration step FAILED — aborting deploy BEFORE any service restart; the fleet keeps running the previous code. Fix the migration and re-deploy."
                  exit 1
                fi
              fi
            fi

            SERVER1_AGENTS=("FRIDAY" "Inference" "Memora" "Stratex" "IntelX" "Futuris" "Forge")
            RESTARTED_AGENTS=""
            for AGENT in "${SERVER1_AGENTS[@]}"; do
              if echo "$CHANGED_AGENTS" | grep -qw "$AGENT" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                if [ "$(systemctl show "${AGENT}.service" --property=LoadState --value)" = loaded ]; then
                  echo "=== Restarting ${AGENT}.service ==="
                  sudo systemctl restart "${AGENT}.service"
                  RESTARTED_AGENTS="$RESTARTED_AGENTS $AGENT"
                  sudo systemctl is-active "${AGENT}.service" || echo "${AGENT} is not running"
                else
                  echo "=== ${AGENT}.service not registered yet. Code pulled cleanly. ==="
                fi
              fi
            done
            
            # The LiveKit process imports FRIDAY source too; API restart alone
            # does not load changed voice tools into the running worker.
            if echo "$CHANGED_AGENTS" | grep -qw "FRIDAY" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "$(systemctl show FRIDAY-Voice.service --property=LoadState --value)" = loaded ]; then
                sudo systemctl restart FRIDAY-Voice.service
                sudo systemctl is-active --quiet FRIDAY-Voice.service
              fi
            fi

            if echo "$CHANGED_AGENTS" | grep -qw "Stratex" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "$(systemctl show Stratex-Daemon.service --property=LoadState --value)" = loaded ]; then
                echo "=== Restarting Stratex-Daemon.service ==="
                sudo systemctl restart Stratex-Daemon.service
              fi
            fi

            # ── Voice worker (2026-11-13): the LiveKit worker is its own unit
            # (FRIDAY-Voice.service) that the loop above never restarted, so
            # worker code changes silently stayed unloaded. It also needs the
            # livekit-plugins-groq package for the WORKING Groq speech path
            # (the Gemini key on this host is dead — 400 API_KEY_INVALID —
            # proven by the live-chain probe 2026-11-13: worker joined and
            # published a track but produced ZERO audio frames). Install the
            # plugin into whatever interpreter runs the unit, then restart it.
            if echo "$CHANGED_AGENTS" | grep -qw "FRIDAY" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "$(systemctl show FRIDAY-Voice.service --property=LoadState --value)" = loaded ]; then
                echo "=== Voice worker: ensuring livekit-plugins-groq ==="
                # ExecStart is systemd-JSON on systemd 249+ ("{ \"path\": ... }")
                # and a plain command line on older systems — try the unit file
                # first, then the JSON, then the plain value.
                VOICE_PY=$(systemctl cat FRIDAY-Voice.service 2>/dev/null | grep -E '^ExecStart=' | head -1 | sed 's/^ExecStart=//' | awk '{print $1}' || true)
                if [ -z "$VOICE_PY" ]; then
                  VOICE_PY=$(systemctl show FRIDAY-Voice.service -p ExecStart --value 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("path",""))' 2>/dev/null || true)
                fi
                if [ -z "$VOICE_PY" ]; then
                  VOICE_PY=$(systemctl show FRIDAY-Voice.service -p ExecStart --value 2>/dev/null | awk '{print $1}' || true)
                fi
                if [ -n "$VOICE_PY" ] && [ "${VOICE_PY:0:1}" != "{" ]; then
                  "$VOICE_PY" -m pip install -q livekit-plugins-groq 2>/dev/null \
                    || "$VOICE_PY" -m pip install -q --user livekit-plugins-groq 2>/dev/null \
                    || sudo "$VOICE_PY" -m pip install -q livekit-plugins-groq 2>/dev/null \
                    || echo "::warning::could not install livekit-plugins-groq into $VOICE_PY — worker will report 'no-provider' honestly"
                  echo "=== groq plugin check ==="
                  "$VOICE_PY" -c 'from livekit.plugins import groq; print("livekit-plugins-groq import OK")' 2>&1 || echo "::warning::groq plugin still not importable"
                else
                  echo "::warning::FRIDAY-Voice ExecStart not parseable — skipping plugin install"
                fi
                echo "=== Restarting FRIDAY-Voice.service ==="
                sudo systemctl restart FRIDAY-Voice.service
                sleep 5
                sudo systemctl is-active FRIDAY-Voice.service || echo "::error::FRIDAY-Voice is not running after restart"
              fi
            fi

            # ── TASK-OBS-001 post-deploy health gate ─────────────────────────────
            # A unit under Restart=always can sit in a crash loop and still read
            # "active". Probe each restarted agent over HTTP and surface failures
            # in the job log instead of leaving them silent.
            echo "=== Post-deploy health gate ==="
            FAILED_HEALTH=""
            for AGENT in "${SERVER1_AGENTS[@]}"; do
              PORT=""
              PROBES=12   # 12 x 5s = 60s is enough for the lightweight agents
              case "$AGENT" in
                FRIDAY) PORT=10000; PROBES=36;;   # FRIDAY boots the full FastAPI graph on 2 cores — measured slower than the old 60s window
                Inference) PORT=8001;; Memora) PORT=8002;;
                Stratex) PORT=8003;; Futuris) PORT=8004;; IntelX) PORT=8005;; Forge) PORT=8006;;
              esac
              [ -n "$PORT" ] || continue
              OK=""
              for i in $(seq 1 $PROBES); do
                if curl -sf -m 5 "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then OK=yes; break; fi
                sleep 5
              done
              if [ "$OK" = "yes" ]; then
                RESTARTS=$(systemctl show "$AGENT.service" --property=NRestarts --value)
                echo "    $AGENT: healthy (NRestarts=$RESTARTS)"
                if [ "${RESTARTS:-0}" -gt 3 ]; then
                  echo "    ::warning::$AGENT restarted ${RESTARTS}x since boot — possible crash loop"
                fi
              else
                STATUS=$(systemctl is-active "$AGENT.service" || true)
                echo "    ::error::$AGENT UNHEALTHY after deploy (systemd: $STATUS)"
                FAILED_HEALTH="$FAILED_HEALTH $AGENT"
              fi
            done
            # ── TASK-OBS-005 second-chance sweep ─────────────────────────────
            # PR #868's deploy (2026-11-17) landed in full yet the job
            # concluded FAILURE: the simultaneous restart of every unit on
            # the 956MB host left FRIDAY/Stratex/Futuris still starting
            # when their first-pass probe windows expired. Before failing
            # the job, give the failed agents ONE bounded second pass
            # after a settle delay. A genuinely dead agent fails both
            # sweeps and still fails the job — this only widens the
            # window for slow starters under a full-fleet restart.
            if [ -n "$FAILED_HEALTH" ]; then
              echo "=== Health gate: second-chance sweep after 60s settle (TASK-OBS-005) ==="
              sleep 60
              STILL_FAILED=""
              for AGENT in $FAILED_HEALTH; do
                PORT=""
                case "$AGENT" in
                  FRIDAY) PORT=10000;; Inference) PORT=8001;; Memora) PORT=8002;;
                  Stratex) PORT=8003;; Futuris) PORT=8004;; IntelX) PORT=8005;; Forge) PORT=8006;;
                esac
                [ -n "$PORT" ] || continue
                OK=""
                for i in $(seq 1 12); do
                  if curl -sf -m 5 "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then OK=yes; break; fi
                  sleep 5
                done
                if [ "$OK" = "yes" ]; then
                  echo "    $AGENT: healthy on second pass"
                else
                  echo "    ::error::$AGENT still UNHEALTHY on second pass"
                  STILL_FAILED="$STILL_FAILED $AGENT"
                fi
              done
              FAILED_HEALTH="$STILL_FAILED"
            fi
            if [ -n "$FAILED_HEALTH" ]; then
              echo "::error::Deploy completed but health gate failed for:$FAILED_HEALTH — run scripts/rollback_deploy.sh <last-good-sha> or the 'Fleet Rollback' workflow"
              exit 1
            fi
            echo "=== Health gate passed on Server 1 ==="

            # ── TASK-MEM-009 post-deploy memory-path smoke ──────────────────
            # /health does not exercise the memory_records ORM: on 2026-11-17
            # a merged-but-unapplied migration left every Memora memory path
            # broken for ~1.5h while the health gate above stayed green. When
            # this run restarted Memora, prove the real path — a capture ->
            # search round-trip as an authenticated identity, with the probe
            # record cleaned up — before calling the deploy good. The probe
            # checks response bodies, not just HTTP status: a schema-behind
            # Memora answers capture with HTTP 200 and stored:false.
            if echo " $RESTARTED_AGENTS " | grep -qw "Memora"; then
              echo "=== Memora memory-path smoke probe ==="
              MEMORA_PY=$(systemctl cat Memora.service 2>/dev/null | grep -E '^ExecStart=' | head -1 | sed 's/^ExecStart=//' | awk '{print $1}' || true)
              if [ -z "$MEMORA_PY" ] || [ "${MEMORA_PY:0:1}" = "{" ] || [ ! -x "$MEMORA_PY" ]; then
                MEMORA_PY="/opt/friday_universe/venv/bin/python"
              fi
              if "$MEMORA_PY" Memora/scripts/smoke_memory_path.py; then
                echo "    Memora: memory-path smoke PASSED"
              else
                echo "::error::Memora memory-path smoke FAILED after deploy — the memory path is broken even though /health passed; run scripts/rollback_deploy.sh <last-good-sha> or the 'Fleet Rollback' workflow"
                exit 1
              fi
            fi

  deploy-server2:
    name: Deploy Specialist Fleet (Server 2)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server2 == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Changed Agents on Server 2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "=== Syncing FRIDAY Universe on Server 2 (FRIDAY Universe VNIC 2) ==="
            cd /opt/friday_universe
            # BEGIN SAFE CHECKOUT — preserve collaborator work, pin this run.
            set -euo pipefail
            DEPLOY_REV="${{ github.sha }}"
            [[ "$DEPLOY_REV" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid deployment revision"; exit 1; }
            # BEGIN MAIN-BRANCH GUARD (TASK-OBS-005) — Fleet CD fast-forwards
            # into the CURRENT checkout and never switches branches, so a
            # checkout parked on a non-main branch can pass every other check
            # (its HEAD can be an ancestor of the deploy revision) while the
            # ff advances the WRONG branch and main stays stranded (defect
            # D9, three recurrences 2026-11-16/17). Assert main BEFORE the
            # fast-forward and fail loudly, naming the branch. This block is
            # identical in both deploy jobs and is executed by
            # tests/test_fleet_cd_branch_guard.py — keep them in sync.
            DEPLOY_BRANCH="$(git branch --show-current)"
            if [ "$DEPLOY_BRANCH" != "main" ]; then
              echo "::error::TASK-OBS-005 branch guard: /opt/friday_universe is checked out on branch '${DEPLOY_BRANCH:-<detached HEAD>}' instead of 'main' — refusing to fast-forward. Return the checkout to the main branch and re-run this deploy."
              exit 1
            fi
            echo "Branch guard (TASK-OBS-005): checkout is on 'main'; proceeding."
            # END MAIN-BRANCH GUARD (TASK-OBS-005)
            OLD_REV=$(git rev-parse HEAD)
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Tracked collaborator changes present; refusing deployment without modifying them."
              exit 1
            fi
            git fetch --no-tags origin "$DEPLOY_REV"
            git cat-file -e "$DEPLOY_REV^{commit}"
            if ! git merge-base --is-ancestor "$OLD_REV" "$DEPLOY_REV"; then
              echo "Checkout diverges from deployment revision; manual reconciliation required."
              exit 1
            fi
            # Git refuses untracked-path collisions. No clean/reset/stash, no
            # force or branch switch; preserve all local work and ancestry.
            git -c merge.autoStash=false merge --ff-only "$DEPLOY_REV"
            [ "$(git rev-parse HEAD)" = "$DEPLOY_REV" ]
            # END SAFE CHECKOUT
            
            CHANGED_AGENTS=$(git diff --name-only $OLD_REV HEAD 2>/dev/null | awk -F/ '{print $1}' | sort -u)
            echo "Changed folders detected: $CHANGED_AGENTS"
            
            SERVER2_AGENTS=("VyralX" "Sentinel" "Cortex")
            for AGENT in "${SERVER2_AGENTS[@]}"; do
              if echo "$CHANGED_AGENTS" | grep -qw "$AGENT" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                if [ "$(systemctl show "${AGENT}.service" --property=LoadState --value)" = loaded ]; then
                  echo "=== Restarting ${AGENT}.service ==="
                  sudo systemctl restart "${AGENT}.service"
                  sudo systemctl is-active "${AGENT}.service" || echo "${AGENT} is not running"
                else
                  echo "=== ${AGENT}.service not registered yet. Code pulled cleanly. ==="
                fi
              fi
            done
            
            if echo "$CHANGED_AGENTS" | grep -qw "VyralX" || echo "$CHANGED_AGENTS" | grep -Eqw "mesh|deploy|scripts" || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "$(systemctl show VyralX-Daemon.service --property=LoadState --value)" = loaded ]; then
                echo "=== Restarting VyralX-Daemon.service ==="
                sudo systemctl restart VyralX-Daemon.service
              fi
            fi

            # ── TASK-OBS-001 post-deploy health gate ─────────────────────────────
            echo "=== Post-deploy health gate ==="
            FAILED_HEALTH=""
            for AGENT in "${SERVER2_AGENTS[@]}"; do
              PORT=""
              case "$AGENT" in
                Sentinel) PORT=8008;; Cortex) PORT=8009;; VyralX) PORT=8010;;
              esac
              [ -n "$PORT" ] || continue
              OK=""
              for i in $(seq 1 12); do
                if curl -sf -m 5 "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then OK=yes; break; fi
                sleep 5
              done
              if [ "$OK" = "yes" ]; then
                RESTARTS=$(systemctl show "$AGENT.service" --property=NRestarts --value)
                echo "    $AGENT: healthy (NRestarts=$RESTARTS)"
                if [ "${RESTARTS:-0}" -gt 3 ]; then
                  echo "    ::warning::$AGENT restarted ${RESTARTS}x since boot — possible crash loop"
                fi
              else
                STATUS=$(systemctl is-active "$AGENT.service" || true)
                echo "    ::error::$AGENT UNHEALTHY after deploy (systemd: $STATUS)"
                FAILED_HEALTH="$FAILED_HEALTH $AGENT"
              fi
            done
            # ── TASK-OBS-005 second-chance sweep (see Server 1 gate) ─────────
            if [ -n "$FAILED_HEALTH" ]; then
              echo "=== Health gate: second-chance sweep after 60s settle (TASK-OBS-005) ==="
              sleep 60
              STILL_FAILED=""
              for AGENT in $FAILED_HEALTH; do
                PORT=""
                case "$AGENT" in
                  Sentinel) PORT=8008;; Cortex) PORT=8009;; VyralX) PORT=8010;;
                esac
                [ -n "$PORT" ] || continue
                OK=""
                for i in $(seq 1 12); do
                  if curl -sf -m 5 "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then OK=yes; break; fi
                  sleep 5
                done
                if [ "$OK" = "yes" ]; then
                  echo "    $AGENT: healthy on second pass"
                else
                  echo "    ::error::$AGENT still UNHEALTHY on second pass"
                  STILL_FAILED="$STILL_FAILED $AGENT"
                fi
              done
              FAILED_HEALTH="$STILL_FAILED"
            fi
            if [ -n "$FAILED_HEALTH" ]; then
              echo "::error::Deploy completed but health gate failed for:$FAILED_HEALTH — run scripts/rollback_deploy.sh <last-good-sha> or the 'Fleet Rollback' workflow"
              exit 1
            fi
            echo "=== Health gate passed on Server 2 ==="
