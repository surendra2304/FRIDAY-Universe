name: Memora Vector Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "Memora/storage/vector/oracle_vector_adapter.py"
      - "Memora/tests/test_oracle_vector_tenant_isolation.py"
      - "Memora/tests/test_oracle_23ai_vector.py"
      - "Memora/core/memory/pipeline/write_service.py"
      - "Memora/tests/test_memory_write_share_authorization.py"
      - "Memora/apps/api/routers/v1_task.py"
      - "Memora/tests/test_task_receipt_truthfulness.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memora-vector-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vector-regressions:
    name: Tenant ownership and transaction boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Memora
    env:
      MEMORA_ENV: testing
      ENVIRONMENT: testing
      MEMORA_EMBEDDING_MODE: hashing
      DATABASE_URL: sqlite:///./data/memora_ci_test.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Memora/requirements.txt

      - name: Install Memora test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Oracle-vector adapter regressions without external services
        run: |
          python -m pytest -q \
            tests/test_oracle_vector_tenant_isolation.py \
            tests/test_oracle_23ai_vector.py \
            tests/test_memory_access_controller_auth.py \
            tests/test_memory_write_share_authorization.py \
            tests/test_task_receipt_truthfulness.py
