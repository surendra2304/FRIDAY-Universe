name: FRIDAY Universe CI/CD

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      # TASK-REL-088: tier-1 collection gate. The test job must collect the
      # tier-1 suites of EVERY agent (21 files, 10 agents). Unlike the
      # REL-068 diff-scoped audit, this gate checks a FIXED list, so a PR
      # that unwires a suite without touching a test file fails here.
      - name: Tier-1 collection gate (all agents)
        run: python3 scripts/tier1_collection_gate.py

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pydantic pytest pytest-cov requests numpy scipy matplotlib pandas ruff

      # Checklist I5: the seven engine suites run as ONE invocation so coverage
      # accumulates across them, then scripts/coverage_gate.py enforces the
      # F13.4 (Tier-1 spec): lint before tests so style/import errors fail
      # fast with a readable report.
      - name: Lint (ruff check)
        # Net widened 2026-11-12 (ZAI Agent 2): the tools/builtin exclusion was
        # stale — the legacy nest held only 2 trivial f-string findings, fixed.
        # The lint now covers the entire friday package.
        run: ruff check FRIDAY/src/friday --output-format=concise

      # Undefined-name sweep 2026-11-12 (ZAI Agent 2): all 8 sibling apps held
      # latent NameError crashes (38 sites) — missing imports, self-referencing
      # constructors, wrong loop variables. All fixed; F821 now gated in CI so
      # the bug class can never land again.
      - name: Lint siblings (ruff F821 — undefined names)
        run: |
          ruff check Memora Stratex Inference Sentinel IntelX Futuris VyralX Forge \
            --select F821 --output-format=concise

      # regression-class floors in tests/COVERAGE_MANIFEST.json. A PR that
      # deletes/breaks the tests for a covered module fails here, not silently.
      - name: Run engine test suites with coverage
        # TASK-REL-086: on failure the wrapper prints the failing test
        # names + log tail into the check-run summary, so the exact
        # failing test is recoverable without sign-in-gated logs.
        run: |
          python3 scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run engine test suites with coverage" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- python3 -m pytest \
            tests/test_real_functional_engines.py \
            tests/test_real_cross_agent_integration.py \
            tests/test_real_advanced_engines.py \
            tests/test_real_deep_engines.py \
            tests/test_real_universe_orchestrator.py \
            tests/test_real_realtime_pipeline.py \
            tests/test_real_universe_dashboard.py \
            tests/test_real_deep_layer4b.py \
            tests/test_coverage_gate.py \
            -v --tb=short \
            --cov=FRIDAY/apps/core/src/friday_core \
            --cov-report=term-missing \
            --cov-report=json:coverage_ci.json

      - name: Coverage gate (regression classes — checklist I5)
        run: |
          python3 scripts/coverage_gate.py coverage_ci.json

      - name: Run Memora vector tenant and transaction regressions
        working-directory: Memora
        env:
          MEMORA_ENV: testing
          ENVIRONMENT: testing
          MEMORA_EMBEDDING_MODE: hashing
          DATABASE_URL: sqlite:///./data/memora_ci_test.db
        run: |
          python3 -m venv .venv-vector-ci
          .venv-vector-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary (wrapper path is
          # repo-root-relative from this step's working directory).
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Memora vector tenant and transaction regressions" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-vector-ci/bin/python -m pytest -q \
            tests/test_oracle_vector_tenant_isolation.py \
            tests/test_oracle_23ai_vector.py \
            tests/test_memory_tenant_admin_maintenance_isolation.py \
            tests/test_memory_access_controller_auth.py \
            tests/test_memory_write_share_authorization.py \
            tests/test_task_receipt_truthfulness.py \
            tests/test_cross_tenant_context_isolation.py \
            tests/test_schema_init_migrations.py \
            tests/test_rel015_reconciliation.py \
            tests/test_mem009_deploy_migrations.py\
            tests/test_mem013_memory_promotion.py \
            tests/test_mem016_promotion_readability_sweep.py
          # TASK-REL-001: the viking durability suite runs as its own
          # invocation in the same step. Its store-failure simulations fail
          # when they share a pytest process with
          # test_task_receipt_truthfulness.py or
          # test_memory_write_share_authorization.py (verified locally:
          # 2 failures in-process, 6/6 green standalone).
          # TASK-REL-086: same failure-summary wrapper as above.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Memora vector tenant and transaction regressions" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-vector-ci/bin/python -m pytest -q \
            tests/test_viking_context_durability.py

      # TASK-REL-080: Cortex tier-1 tests (CTX-003 G5 re-run). The test job
      # ran repo-root suites only, so Cortex tests never ran in CI. The two
      # tier-1 files run in their own venv from Cortex/requirements.txt
      # (same pattern as the Memora vector step above); Cortex conftest.py
      # sets the test JWT secret and workspace paths, so no fleet secrets
      # are needed. Five deselects are pre-existing failures proven on
      # current main — see docs/collaboration/TASK-REL-080-CORTEX-TIER1-CI.md:
      # F16.3/F16.4 in both files (README/.env.example lack POSTGRES_DSN)
      # and F8.3 in tests/e2e (stale pre-COR-005 assertion).
      - name: Run Cortex tier-1 tests
        working-directory: Cortex
        run: |
          python3 -m venv .venv-cortex-ci
          .venv-cortex-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio pyyaml aiosqlite
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary — this is the step
          # that runs test_f3_peer_transport_exponential_backoff, the test
          # REL-080 repair run 4 could not name from the summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Cortex tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-cortex-ci/bin/python -m pytest -q \
            tests/unit/test_e2e_tier1.py tests/e2e/test_e2e_tier1.py \
            --deselect tests/unit/test_e2e_tier1.py::test_f16_readme_contains_env_vars_table \
            --deselect tests/unit/test_e2e_tier1.py::test_f16_env_example_contains_all_core_settings \
            --deselect tests/e2e/test_e2e_tier1.py::test_f16_readme_contains_env_vars_table \
            --deselect tests/e2e/test_e2e_tier1.py::test_f16_env_example_contains_all_core_settings \
            --deselect tests/e2e/test_e2e_tier1.py::test_f8_post_plan_valid_payload

      # TASK-REL-088: FRIDAY tier-1 tests. Own venv from
      # TASK-INF-032: tests/test_llm_escalation.py rides in this
      # invocation so the REL-068 test-collection guard sees it
      # collected by a PR-triggered workflow (it was uncollected
      # before; the file needs the same venv — requirements.txt
      # carries the provider SDKs its import chain needs).
      # FRIDAY/requirements.txt + pytest + pytest-asyncio (the suite uses
      # @pytest.mark.asyncio; requirements.txt lacks the plugin). Proven
      # locally on current main: 86 passed, 0 failed, 0 deselects - see
      # docs/collaboration/TASK-REL-088-TIER1-ALL-AGENTS.md.
      - name: Run FRIDAY tier-1 tests
        working-directory: FRIDAY
        run: |
          python3 -m venv .venv-friday-ci
          .venv-friday-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run FRIDAY tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-friday-ci/bin/python -m pytest -q \
            tests/test_tier1_resilience_and_contracts.py tests/e2e/test_tier1_features.py \
            tests/test_llm_escalation.py

      # TASK-REL-088: Memora tier-1 tests. Same venv pattern as the vector
      # step above, plus pytest + pytest-asyncio; same env, but a separate
      # sqlite file (memora_ci_tier1.db) so the tier-1 run starts from a
      # fresh DB exactly like the local proof runs. Two deselects are
      # pre-existing failures proven on current main - see the evidence
      # doc: /health returns 503 and /ready omits the "wal" key.
      - name: Run Memora tier-1 tests
        working-directory: Memora
        env:
          MEMORA_ENV: testing
          ENVIRONMENT: testing
          MEMORA_EMBEDDING_MODE: hashing
          DATABASE_URL: sqlite:///./data/memora_ci_tier1.db
        run: |
          python3 -m venv .venv-memora-ci
          .venv-memora-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Memora tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-memora-ci/bin/python -m pytest -q \
            tests/test_tier1_resilience_contracts.py \
            --deselect tests/test_tier1_resilience_contracts.py::test_health_probe_contract \
            --deselect tests/test_tier1_resilience_contracts.py::test_ready_probe_contract

      # TASK-REL-088: Stratex tier-1 tests. Own venv from
      # Stratex/requirements.txt + pytest + pytest-asyncio. One deselect is
      # a pre-existing failure proven on current main - see the evidence
      # doc: /health returns 503, expects 200 (same signature as Memora).
      - name: Run Stratex tier-1 tests
        working-directory: Stratex
        run: |
          python3 -m venv .venv-stratex-ci
          .venv-stratex-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Stratex tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-stratex-ci/bin/python -m pytest -q \
            tests/test_tier1_resilience_and_contracts.py \
            --deselect tests/test_tier1_resilience_and_contracts.py::TestStandardizedContracts::test_health_includes_service_metadata

      # TASK-REL-088: Forge tier-1 tests. Own venv from
      # Forge/requirements.txt + pytest + pytest-asyncio + respx (one test
      # needs respx; it fails on collection without it). Six deselects are
      # pre-existing failures proven on current main - see the evidence
      # doc: ready probe 503, diagnostics status "unhealthy" (no live
      # Oracle ADB in the test env), db_path TypeError x2, postgres URL
      # translation RuntimeError, PRAGMA no-op expectation.
      - name: Run Forge tier-1 tests
        working-directory: Forge
        env:
          # Forge/app imports the repo-root `mesh` package
          # (app/verification/engine.py), so the repo root must be on
          # PYTHONPATH; without it collection fails with
          # ModuleNotFoundError: No module named 'mesh'.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m venv .venv-forge-ci
          .venv-forge-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio respx
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Forge tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-forge-ci/bin/python -m pytest -q \
            tests/unit/test_tier1_resilience.py tests/unit/test_deep_upgrade_tier1.py \
            --deselect tests/unit/test_tier1_resilience.py::test_ready_probe_contract \
            --deselect tests/unit/test_tier1_resilience.py::test_status_diagnostics_endpoint \
            --deselect tests/unit/test_tier1_resilience.py::test_sqlite_pragmas_and_wal_mode \
            --deselect tests/unit/test_deep_upgrade_tier1.py::test_database_manager_crud_and_row_mapping \
            --deselect tests/unit/test_deep_upgrade_tier1.py::test_async_db_connection_wrapper_features \
            --deselect tests/unit/test_deep_upgrade_tier1.py::test_oracle_and_postgres_url_translation

      # TASK-REL-088: Inference tier-1 set (no tier-1-named suite exists,
      # so tier-1 = the health-contract + importability core files).
      # Own venv from Inference/requirements.txt + pytest + pytest-asyncio
      # + aiosqlite (requirements.txt lacks aiosqlite; the async-sqlite
      # import fails without it). Proven locally on current main: 12
      # passed, 0 failed, 0 deselects - see the evidence doc.
      - name: Run Inference tier-1 tests
        working-directory: Inference
        run: |
          python3 -m venv .venv-inference-ci
          .venv-inference-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio aiosqlite
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Inference tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-inference-ci/bin/python -m pytest -q \
            tests/test_health_security.py tests/test_module_importability.py tests/test_monitoring_health_evidence.py

      # TASK-REL-088: Sentinel tier-1 set (health-contract + durability +
      # foundation core files; no tier-1-named suite exists). Own venv
      # from Sentinel/requirements.txt + pytest + pytest-asyncio. Proven
      # locally on current main: 13 passed, 0 failed, 0 deselects - see
      # the evidence doc.
      - name: Run Sentinel tier-1 tests
        working-directory: Sentinel
        run: |
          python3 -m venv .venv-sentinel-ci
          .venv-sentinel-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Sentinel tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-sentinel-ci/bin/python -m pytest -q \
            tests/security/test_health_readiness.py tests/security/test_health_durability_truthfulness.py tests/unit/test_foundation.py

      # TASK-REL-088: IntelX tier-1 set (health-contract core files; no
      # tier-1-named suite exists). Own venv from IntelX/requirements.txt
      # + pytest + pytest-asyncio + aiosqlite (requirements.txt has
      # sqlalchemy[asyncio] but no aiosqlite; collection errors without
      # it). Proven locally on current main: 22 passed, 0 failed,
      # 0 deselects - see the evidence doc.
      - name: Run IntelX tier-1 tests
        working-directory: IntelX
        run: |
          python3 -m venv .venv-intelx-ci
          .venv-intelx-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio aiosqlite
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run IntelX tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-intelx-ci/bin/python -m pytest -q \
            tests/test_intelx_health_contract.py tests/test_health.py tests/test_healthz_liveness.py

      # TASK-REL-088: Futuris tier-1 set (health-contract core files; no
      # tier-1-named suite exists). Own venv from Futuris/requirements.txt
      # + pytest + pytest-asyncio + aiosqlite. DATABASE_URL is a dummy
      # oracle+oracledb URL: the import-time check validates the scheme
      # only, and the tests themselves use local SQLite fixtures, so no
      # live Oracle is needed. Proven locally on current main: 8 passed,
      # 0 failed, 0 deselects - see the evidence doc.
      - name: Run Futuris tier-1 tests
        working-directory: Futuris
        env:
          DATABASE_URL: oracle+oracledb://dummy:dummy@localhost:1521/dummy
          # Futuris/futuris/core/pipeline.py imports the repo-root `mesh`
          # package, so the repo root must be on PYTHONPATH; without it
          # collection fails with ModuleNotFoundError: No module named
          # 'mesh' (PR #1604 CI run 45305996260, exit 2). Same fix as Forge.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m venv .venv-futuris-ci
          .venv-futuris-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio aiosqlite
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run Futuris tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-futuris-ci/bin/python -m pytest -q \
            tests/test_futuris_health_contract.py tests/api/test_health.py

      # TASK-REL-088: VyralX tier-1 set (recovery + health-labelling core
      # files; no tier-1-named suite exists). VyralX has no
      # requirements.txt; install from requirements.lock (SEN-012 pinned
      # snapshot) + pytest + pytest-asyncio. Proven locally on current
      # main: 5 passed, 0 failed, 0 deselects - see the evidence doc.
      # NOTE: a fresh lock install is unproven locally; the work PR's CI
      # run is the proof of that path.
      - name: Run VyralX tier-1 tests
        working-directory: VyralX
        run: |
          python3 -m venv .venv-vyralx-ci
          .venv-vyralx-ci/bin/python -m pip install --disable-pip-version-check -r requirements.lock pytest pytest-asyncio
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 ../scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Run VyralX tier-1 tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- .venv-vyralx-ci/bin/python -m pytest -q \
            tests/test_recovery_and_readiness.py tests/test_obs003_health_labelling.py

      - name: Start API server and run HTTP tests
        run: |
          PYTHONPATH=FRIDAY/apps/core/src:Inference/app:Inference:Memora:Stratex:Forge/app/services:Sentinel/app/services:IntelX/intelx/services:Futuris/futuris/core:VyralX/app/services \
          python3 -m uvicorn friday_core.real_api_server:app --host 0.0.0.0 --port 8000 &
          sleep 5
          # TASK-REL-086: on failure the wrapper prints the failing test
          # names + log tail into the check-run summary.
          python3 scripts/ci_failure_summary.py \
            --pytest \
            --check "test-job" \
            --step "Start API server and run HTTP tests" \
            --workflow ".github/workflows/friday-universe-ci.yml" \
            --job "test" \
            -- python3 -m pytest tests/test_real_http_api.py tests/test_real_deep_http_api.py tests/test_real_deep_workflow_http.py tests/test_real_dashboard_http.py -v --tb=short
          kill %1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            **/*.json
            .pytest_cache/
          retention-days: 7

  detect-voice-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      voice: ${{ steps.filter.outputs.voice }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.ref }}
          filters: |
            voice:
              - 'FRIDAY/src/friday/voice/**'
              - 'FRIDAY/tests/test_voice_gemini_only.py'
              - 'FRIDAY/tests/test_voice_*.py'
              - 'FRIDAY/tests/test_gemini_live_voice.py'
              - 'FRIDAY/tests/test_gemini_model_configuration_audit.py'
              - 'FRIDAY/tests/test_model_configuration_consistency.py'
              - 'FRIDAY/tests/test_gemini_provider_runtime_audit.py'
              - 'FRIDAY/tests/test_ux_and_cli.py'
              - 'FRIDAY/tests/test_livekit_token.py'
              - 'FRIDAY/requirements.txt'
              - 'FRIDAY/pyproject.toml'
              - 'FRIDAY/.env.example'
              - 'FRIDAY/src/friday/core/config.py'

  voice-regressions:
    runs-on: ubuntu-latest
    needs: detect-voice-changes
    if: needs.detect-voice-changes.outputs.voice == 'true'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: FRIDAY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FRIDAY/requirements.txt
      - name: Install FRIDAY production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint changed voice surfaces
        run: |
          python -m ruff check \
            src/friday/voice/livekit_worker.py \
            src/friday/voice/confirmation_policy.py \
            src/friday/voice/brain_bridge.py \
            src/friday/voice/language_profiles.py \
            tests/test_voice_gemini_only.py \
            tests/test_voice_live_features.py \
            tests/test_voice_confirmation_policy.py \
            tests/test_voice_language_profiles.py \
            tests/test_voice_surface_contract.py \
            src/friday/voice/dictation.py \
            tests/test_voice_dictation.py \
            tests/test_ux_and_cli.py
      - name: Run voice, LiveKit, Gemini, and CLI regressions
        run: |
          python -m pytest -q \
