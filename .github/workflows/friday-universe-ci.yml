name: FRIDAY Universe CI/CD

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pydantic pytest pytest-cov requests numpy scipy matplotlib pandas ruff

      # Checklist I5: the seven engine suites run as ONE invocation so coverage
      # accumulates across them, then scripts/coverage_gate.py enforces the
      # F13.4 (Tier-1 spec): lint before tests so style/import errors fail
      # fast with a readable report.
      - name: Lint (ruff check)
        # Net widened 2026-11-12 (ZAI Agent 2): the tools/builtin exclusion was
        # stale — the legacy nest held only 2 trivial f-string findings, fixed.
        # The lint now covers the entire friday package.
        run: ruff check FRIDAY/src/friday --output-format=concise

      # Undefined-name sweep 2026-11-12 (ZAI Agent 2): all 8 sibling apps held
      # latent NameError crashes (38 sites) — missing imports, self-referencing
      # constructors, wrong loop variables. All fixed; F821 now gated in CI so
      # the bug class can never land again.
      - name: Lint siblings (ruff F821 — undefined names)
        run: |
          ruff check Memora Stratex Inference Sentinel IntelX Futuris VyralX Forge \
            --select F821 --output-format=concise

      # regression-class floors in tests/COVERAGE_MANIFEST.json. A PR that
      # deletes/breaks the tests for a covered module fails here, not silently.
      - name: Run engine test suites with coverage
        run: |
          python3 -m pytest \
            tests/test_real_functional_engines.py \
            tests/test_real_cross_agent_integration.py \
            tests/test_real_advanced_engines.py \
            tests/test_real_deep_engines.py \
            tests/test_real_universe_orchestrator.py \
            tests/test_real_realtime_pipeline.py \
            tests/test_real_universe_dashboard.py \
            tests/test_real_deep_layer4b.py \
            tests/test_coverage_gate.py \
            -v --tb=short \
            --cov=FRIDAY/apps/core/src/friday_core \
            --cov-report=term-missing \
            --cov-report=json:coverage_ci.json

      - name: Coverage gate (regression classes — checklist I5)
        run: |
          python3 scripts/coverage_gate.py coverage_ci.json

      - name: Run Memora vector tenant and transaction regressions
        working-directory: Memora
        env:
          MEMORA_ENV: testing
          ENVIRONMENT: testing
          MEMORA_EMBEDDING_MODE: hashing
          DATABASE_URL: sqlite:///./data/memora_ci_test.db
        run: |
          python3 -m venv .venv-vector-ci
          .venv-vector-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv-vector-ci/bin/python -m pytest -q \
            tests/test_oracle_vector_tenant_isolation.py \
            tests/test_oracle_23ai_vector.py \
            tests/test_memory_tenant_admin_maintenance_isolation.py \
            tests/test_memory_access_controller_auth.py \
            tests/test_memory_write_share_authorization.py \
            tests/test_task_receipt_truthfulness.py \
            tests/test_cross_tenant_context_isolation.py

      - name: Start API server and run HTTP tests
        run: |
          PYTHONPATH=FRIDAY/apps/core/src:Inference/app:Inference:Memora:Stratex:Forge/app/services:Sentinel/app/services:IntelX/intelx/services:Futuris/futuris/core:VyralX/app/services \
          python3 -m uvicorn friday_core.real_api_server:app --host 0.0.0.0 --port 8000 &
          sleep 5
          python3 -m pytest tests/test_real_http_api.py tests/test_real_deep_http_api.py tests/test_real_deep_workflow_http.py tests/test_real_dashboard_http.py -v --tb=short
          kill %1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/*.json
            .pytest_cache/
          retention-days: 7

  detect-voice-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      voice: ${{ steps.filter.outputs.voice }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.ref }}
          filters: |
            voice:
              - 'FRIDAY/src/friday/voice/**'
              - 'FRIDAY/tests/test_orpheus_terms_fallback.py'
              - 'FRIDAY/tests/test_voice_*.py'
              - 'FRIDAY/tests/test_gemini_live_voice.py'
              - 'FRIDAY/tests/test_gemini_model_configuration_audit.py'
              - 'FRIDAY/tests/test_model_configuration_consistency.py'
              - 'FRIDAY/tests/test_gemini_provider_runtime_audit.py'
              - 'FRIDAY/tests/test_ux_and_cli.py'
              - 'FRIDAY/tests/test_livekit_token.py'
              - 'FRIDAY/requirements.txt'
              - 'FRIDAY/pyproject.toml'

  voice-regressions:
    runs-on: ubuntu-latest
    needs: detect-voice-changes
    if: needs.detect-voice-changes.outputs.voice == 'true'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: FRIDAY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FRIDAY/requirements.txt
      - name: Install FRIDAY production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint changed voice surfaces
        run: |
          python -m ruff check \
            src/friday/voice/livekit_worker.py \
            src/friday/voice/edge_tts_adapter.py \
            tests/test_orpheus_terms_fallback.py \
            tests/test_voice_live_features.py \
            tests/test_ux_and_cli.py
      - name: Run voice, LiveKit, Gemini, and CLI regressions
        run: |
          python -m pytest -q \
            tests/test_orpheus_terms_fallback.py \
            tests/test_voice_subsystem_audit.py \
            tests/test_voice_agent_integration.py \
            tests/test_voice_tool_security.py \
            tests/test_voice_personality.py \
            tests/test_voice_live_features.py \
            tests/test_livekit_token.py \
            tests/test_voice_vision.py \
            tests/test_voice_vision_advanced.py \
            tests/test_gemini_live_voice.py \
            tests/test_gemini_model_configuration_audit.py \
            tests/test_model_configuration_consistency.py \
            tests/test_gemini_provider_runtime_audit.py \
            tests/test_ux_and_cli.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t friday-universe:3.0.0 .

      - name: Docker compose up
        run: docker compose up -d --build

      - name: Verify health
        run: |
          echo "Waiting for service to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/30: service not ready yet, sleeping 2s..."
            sleep 2
          done
          echo "Health check failed. Dumping container logs:"
          docker compose logs
          exit 1

      - name: Docker compose down
        run: docker compose down
