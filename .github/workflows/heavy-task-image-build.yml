name: Heavy-Task Runtime Image Build

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - "docker-compose.oracle.yml"
      - "mesh/**"
      - "Forge/Dockerfile"
      - "Forge/pyproject.toml"
      - "Forge/requirements.txt"
      - "Forge/app/**"
      - "Futuris/Dockerfile"
      - "Futuris/pyproject.toml"
      - "Futuris/requirements.txt"
      - "Futuris/futuris/**"
      - "Sentinel/Dockerfile"
      - "Sentinel/pyproject.toml"
      - "Sentinel/requirements.txt"
      - "Sentinel/sentinel/**"
      - ".github/workflows/heavy-task-image-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavy-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build coordinated workload images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Create secret-free environment placeholders
        shell: bash
        run: |
          set -euo pipefail
          # Real .env files are intentionally untracked; image builds need the
          # paths to exist but must never depend on or receive production secrets.
          for agent in FRIDAY Inference Memora Stratex Forge Cortex Sentinel IntelX Futuris VyralX; do
            touch "$agent/.env"
          done

      - name: Build Forge, Futuris, and Sentinel sequentially
        shell: bash
        env:
          FRIDAY_UNIVERSE_REDIS_PASSWORD: ci-url-safe-password-for-image-build
          COMPOSE_PARALLEL_LIMIT: "1"
        run: |
          set -euo pipefail
          docker compose -f docker-compose.oracle.yml build forge
          docker compose -f docker-compose.oracle.yml build futuris
          docker compose -f docker-compose.oracle.yml build sentinel
