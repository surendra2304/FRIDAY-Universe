name: Secret Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan changed commits for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository and commit range
        uses: actions/checkout@v7
        with:
          # Gitleaks needs both PR base and head commits to scan the change range.
          # It scans base^..head (or the push before/after range), not all ancestors.
          # The legacy leak in commit 46034a4 is tracked separately by TASK-SEC-002.
          fetch-depth: 0

      - name: Scan changed commits with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          # Least privilege: no PR comments or SARIF artifact uploads are needed.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
