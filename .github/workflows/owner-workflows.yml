name: Owner Workflow Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'FRIDAY/src/**'
      - 'FRIDAY/tests/**'
      - 'Forge/app/**'
      - 'Forge/tests/**'
      - 'Inference/app/services/**'
      - 'Inference/tests/test_forge_goal_and_test_generation.py'
      - 'Inference/tests/test_python_fence_boundaries.py'
      - 'Inference/tests/test_inf015_flash_lite_catalogue.py'
      - 'Inference/tests/test_test_generation_reliability_rel026.py'
      - 'Inference/tests/test_unified_manager_cache_scope.py'
      - 'Inference/tests/test_forge_code_review_is_evidence_based.py'
      - 'Inference/tests/test_forge_output_is_verified.py'
      - 'Inference/tests/test_source_repair_context.py'
      - 'Memora/core/memory/search_service.py'
      - 'Memora/tests/test_direct_evidence_ranking.py'
      - 'IntelX/intelx/api/**'
      - 'IntelX/tests/**'
      - 'VyralX/app/**'
      - 'VyralX/tests/**'
      - 'tests/test_live_research_task_contract.py'
      - 'tests/test_safe_fleet_deploy.py'
      - 'tests/**'
      - 'Inference/tests/**'
      - 'Memora/tests/**'
      - 'scripts/ci_test_collection_audit.py'
      - '.github/workflows/deploy-monorepo.yml'
      - '.github/workflows/owner-workflows.yml'
      - 'Stratex/**'
  push:
    branches: [main, 'arena/TASK-WF-004-*']
    paths:
      - 'FRIDAY/src/**'
      - 'FRIDAY/tests/**'
      - 'Forge/app/**'
      - 'Forge/tests/**'
      - 'Inference/app/services/**'
      - 'Inference/tests/test_forge_goal_and_test_generation.py'
      - 'Inference/tests/test_python_fence_boundaries.py'
      - 'Inference/tests/test_inf015_flash_lite_catalogue.py'
      - 'Inference/tests/test_test_generation_reliability_rel026.py'
      - 'Inference/tests/test_unified_manager_cache_scope.py'
      - 'Inference/tests/test_forge_code_review_is_evidence_based.py'
      - 'Inference/tests/test_forge_output_is_verified.py'
      - 'Inference/tests/test_source_repair_context.py'
      - 'Memora/core/memory/search_service.py'
      - 'Memora/tests/test_direct_evidence_ranking.py'
      - 'IntelX/intelx/api/**'
      - 'IntelX/tests/**'
      - 'VyralX/app/**'
      - 'VyralX/tests/**'
      - 'tests/test_live_research_task_contract.py'
      - 'tests/test_safe_fleet_deploy.py'
      - 'tests/**'
      - 'Inference/tests/**'
      - 'Memora/tests/**'
      - 'scripts/ci_test_collection_audit.py'
      - '.github/workflows/deploy-monorepo.yml'
      - '.github/workflows/owner-workflows.yml'
      - 'Stratex/**'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Guard — every test file shipped in this PR is collected (TASK-REL-068)
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_test_collection_audit.py
      - name: Install workflow contract dependencies
        run: >-
          python -m pip install pytest pytest-asyncio fastapi uvicorn httpx
          pydantic-settings 'sqlalchemy[asyncio]' rich python-dotenv psutil beautifulsoup4
          google-genai 'livekit-agents>=1,<2' mcp icalendar recurring-ical-events
          pillow pyperclip openai numpy PyYAML google-api-python-client anthropic aiosqlite
      - name: Exercise four workflow and authority contracts (no external calls)
        run: |
          python -m pytest -q \
            tests/test_live_research_task_contract.py \
            tests/test_safe_fleet_deploy.py \
            tests/test_fleet_cd_rel098_recovery_guard.py \
            tests/test_rel068_collection_canary.py \
            tests/test_rel081_gate_failure_summary.py \
            tests/test_rel086_test_failure_summary.py \
            FRIDAY/tests/test_four_owner_workflows.py \
            FRIDAY/tests/test_persona_clock_annotations.py \
            FRIDAY/tests/test_intelx_research_dispatch.py \
            FRIDAY/tests/test_forge_code_dispatch.py \
            FRIDAY/tests/test_forge_artifact_receipts.py \
            FRIDAY/tests/test_batch7_agent_depth_2.py \
            FRIDAY/tests/test_batch4_memory_brain.py \
            FRIDAY/tests/test_memory_commands.py \
            FRIDAY/tests/test_voice_tool_security.py \
            FRIDAY/tests/test_voice_livekit_health_route.py \
            FRIDAY/tests/test_api_origin_enforcement.py \
            FRIDAY/tests/test_val007_chat_auth_gate.py \
            FRIDAY/tests/test_batch3_delegations.py \
            FRIDAY/tests/test_batch3_part2.py \
            FRIDAY/tests/test_memora_hardening.py \
            FRIDAY/tests/test_orch_012_fallback_fix.py \
            FRIDAY/tests/test_intent_classifier_tier.py \
            FRIDAY/tests/test_gemini_tool_schema_validity.py \
            FRIDAY/tests/test_rel_010_pool_exhaustion.py \
            FRIDAY/tests/test_telegram_webhook.py \
            FRIDAY/tests/test_telegram_gateway_escape.py \
            FRIDAY/tests/test_owner_notify.py \
            FRIDAY/tests/test_frd025_callsite_wiring.py \
            FRIDAY/tests/test_frd028_self_report_gate.py \
            FRIDAY/tests/test_rel018_scrubber_prose.py \
            FRIDAY/tests/test_autonomous_daemon_task_source.py \
            FRIDAY/tests/test_pro002_intelx_watch.py \
            FRIDAY/tests/test_int016_instant_lane.py \
            FRIDAY/tests/test_frd029_activity_timestamps.py \
            FRIDAY/tests/test_frd030_live_activity_timestamp.py \
            FRIDAY/tests/test_codex_invariants_and_mesh.py \
            FRIDAY/tests/test_friday_health_contract.py \
            FRIDAY/tests/test_fleet_probe_labelling.py \
            FRIDAY/tests/test_fleet_status_truth.py \
            FRIDAY/tests/test_obs003_health_honesty.py \
            FRIDAY/tests/test_tier1_resilience_and_contracts.py \
            FRIDAY/tests/test_container_compatibility.py \
            FRIDAY/tests/test_frd041_memory_guard.py \
            FRIDAY/tests/e2e/test_tier1_features.py
      - name: Generated-code ingestion and saved verification status
        env:
          PYTHONPATH: Forge
        run: |
          python -m pip install -r Forge/requirements-verification.txt
          python -m pytest -q Forge/tests/unit/test_response_parser.py \
            Forge/tests/unit/test_parser_and_webstudio_regressions.py \
            Forge/tests/unit/test_generated_test_ingestion.py \
            Forge/tests/unit/test_gate_blocked_rel026.py \
            Forge/tests/unit/test_tester_synthesis_note_rel023.py \
            Forge/tests/unit/test_delegate_verification_status.py \
            Forge/tests/unit/test_task_execute_contract.py \
            Forge/tests/unit/test_missing_test_truthfulness.py \
            Forge/tests/unit/test_verification.py \
            Forge/tests/unit/test_goal_fidelity_contract.py \
            Forge/tests/unit/test_context_manager.py \
            Forge/tests/unit/test_repair_preservation_and_embedded_tests.py \
            Forge/tests/unit/test_generation_boundary_regressions.py \
            Forge/tests/unit/test_release_consent.py \
            Forge/tests/unit/test_github_tool.py \
            Forge/tests/unit/test_execution_security_gates.py \
            Forge/tests/unit/test_delivery_verification_consistency.py \
            Forge/tests/unit/test_source_backed_repair.py \
            Forge/tests/unit/test_artifact_receipts.py \
            Forge/tests/unit/test_portable_fixture_repair.py \
            Forge/tests/unit/test_source_bound_receipts.py \
            Forge/tests/unit/test_task_forge_002_developer_retry.py \
            Forge/tests/unit/test_task_forge_002_recovery_escalation.py \
            Forge/tests/unit/test_task_forge_002_routing.py \
            Forge/tests/unit/test_task_forge_002_truthful_completion.py \
            Forge/tests/unit/test_developer_ai_universe.py \
            Forge/tests/test_frg001_cage.py \
            Forge/tests/test_frg017_idle_experiments.py \
            Forge/tests/test_frg017_wiring_gates.py \
            Forge/tests/test_frg019_idle_stale.py
      - name: Direct memory evidence outranks graph-only context
        env:
          PYTHONPATH: Memora
          MEMORA_ENV: testing
          ENVIRONMENT: testing
          MEMORA_EMBEDDING_MODE: hashing
        run: |
          python -m pip install -r Memora/requirements.txt
          python -m pytest -q Memora/tests/test_direct_evidence_ranking.py \
            Memora/tests/test_hybrid_search.py \
            Memora/tests/test_oracle_vector_tenant_isolation.py \
            Memora/tests/test_cross_tenant_context_isolation.py \
            Memora/tests/test_memory_access_controller_auth.py \
            Memora/tests/test_health_observation_metadata.py \
            Memora/tests/test_health_readiness_truth.py
      - name: Goal-specific code and honest generated-test contracts
        env:
          PYTHONPATH: Inference
        run: |
          python -m pip install -r Inference/requirements.txt
          python -m pytest -q Inference/tests/test_forge_goal_and_test_generation.py \
            Inference/tests/test_test_generation_reliability_rel026.py \
            Inference/tests/test_unified_manager_cache_scope.py \
            Inference/tests/test_forge_code_review_is_evidence_based.py \
            Inference/tests/test_python_fence_boundaries.py \
            Inference/tests/test_forge_output_is_verified.py \
            Inference/tests/test_source_repair_context.py \
            Inference/tests/test_inf015_flash_lite_catalogue.py \
            Inference/tests/test_rel047_gateway_guards.py \
            Inference/tests/test_gemini_token_accounting.py \
            Inference/tests/test_inf030_apinex_fallback.py \
            Inference/tests/test_inf008_failover_drill.py \
            Inference/tests/test_key_inventory_report.py \
            Inference/tests/test_universal_task_and_waterfall.py \
            Inference/tests/test_inf042_free_tier_routes.py
      - name: Futuris health-capability contracts (TASK-REL-067)
        env:
          PYTHONPATH: Futuris
          # Mock Oracle DSN: futuris.infra.config validates DATABASE_URL at
          # import time (fail-closed, Oracle-only), so the conftest import
          # raises RuntimeError and pytest exits 4 without it. The tests
          # themselves run against throwaway SQLite engines; nothing here
          # connects to Oracle. Same mock value as validate-monorepo.yml.
          DATABASE_URL: oracle+oracledb://mock:mock@localhost:1521/FREE
        run: |
          python -m pip install -r Futuris/requirements.txt aiosqlite
          python -m pytest -q \
            Futuris/tests/test_futuris_health_contract.py \
            Futuris/tests/api/test_health.py \
            Futuris/tests/api/test_hostile_inputs.py
      - name: IntelX health-capability contracts (TASK-REL-067)
        env:
          PYTHONPATH: IntelX
        run: |
          python -m pip install -r IntelX/requirements.txt aiosqlite
          python -m pytest -q \
            IntelX/tests/test_intelx_health_contract.py \
            IntelX/tests/test_health.py \
            IntelX/tests/test_healthz_liveness.py \
            IntelX/tests/test_int040_outbox_shipper.py
      - name: IntelX synthesis verification contracts
        env:
          PYTHONPATH: IntelX
        run: |
          python -m pip install -r IntelX/requirements.txt
          python -m pytest -q IntelX/tests/test_int005_verification_pass.py
      - name: Stratex forward-test and self-experiment contracts
        run: |
          python -m pip install 'pandas>=2.2,<4' requests flask flask-cors python-binance
          python -m pytest -q \
            Stratex/tests/test_fwd018_bollinger_variants.py \
            Stratex/tests/test_fwd018_ichimoku_variants.py \
            Stratex/tests/test_fwd018_lane_visibility.py \
            Stratex/tests/test_fwd018_shock_variants.py \
            Stratex/tests/test_fwd021_overlay_service.py \
            Stratex/tests/test_fwd028_overlay_allowlist_gate.py \
            Stratex/tests/test_fwd024_panel_xs.py \
            Stratex/tests/test_exp001_self_experiments.py \
            Stratex/tests/test_exp002_ensemble_book.py \
            Stratex/tests/test_str047_scope_admission.py \
            Stratex/tests/test_exp004_daemon_wiring.py \
            Stratex/tests/test_str_exp_006_starvation_breaker.py \
            Stratex/tests/test_pep001_pepperstone_ctrader_adapter.py \
            Stratex/tests/test_fwd026_adoption_opened_at.py \
            Stratex/tests/test_fwd020_supertrend_bare_lane.py \
            Stratex/tests/test_str_daemon_002_daily_summary_throttle.py \
            Stratex/tests/test_str_daemon_003_startup_pair_throttle.py \
            Stratex/tests/test_str_daemon_004_send_log.py \
            Stratex/tests/test_engine_capability_truthfulness.py \
            Stratex/tests/test_str_fwd_032_classic_testnet_excision.py \
            Stratex/tests/test_live_trading_guard.py \
            Stratex/tests/test_binance_futures_agent.py \
            Stratex/tests/test_binance_futures_live_gate.py \
            Stratex/tests/test_binance_futures_oms_adapter.py \
            Stratex/tests/test_data_client.py \
            Stratex/tests/test_emergency_halt_endpoint.py \
            Stratex/tests/test_quant_agent.py \
            Stratex/tests/test_telegram_bot.py \
            Stratex/tests/test_daemon_heartbeat_health.py \
            Stratex/tests/test_rel_071_stratex_health_path.py \
            Stratex/tests/test_str076_repo_implement_wave1.py \
            Stratex/tests/test_daily_fill_ledger_reconciliation.py
      - name: Install ffmpeg for VyralX real-render contracts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
