        env:
          APP_ENV: development
          DATA_DIR: /tmp/vyralx-contract-data
          MEDIA_DIR: /tmp/vyralx-contract-media
          RENDER_DIR: /tmp/vyralx-contract-renders
          PYTHONPATH: VyralX
        run: |
          python -m pip install 'edge-tts>=6.1,<8.0' 'yt-dlp>=2025.1'
          python -m pytest -q VyralX/tests/test_review_required_project.py \
            VyralX/tests/test_project_pipeline_e2e.py VyralX/tests/test_project_review.py \
            VyralX/tests/test_viral_framing.py VyralX/tests/test_vyr014_quality_gates.py \
            VyralX/tests/test_vyr031_script_stage_yield.py VyralX/tests/test_vyr032_doubled_caption.py \
            VyralX/tests/test_viral_loop.py \
            VyralX/tests/test_vyr001_autopilot_cycle_budget.py \
            VyralX/tests/test_vyr035_mpt_cycle_deadline.py \
            VyralX/tests/test_vyr036_autonomous_loop_budget.py \
            VyralX/tests/test_path_c_lane_retired.py VyralX/tests/test_ig3_vyr10_scene_assembly_eval.py VyralX/tests/test_vyr037_discovery_helpers.py VyralX/tests/test_vyr039_remix_music_bed.py \
            VyralX/tests/test_viral_bgm.py VyralX/tests/test_vyr045_caption_dedup.py \
            VyralX/tests/test_vyr045_caption_wiring.py \
            VyralX/tests/test_vyr055_discovery_helpers.py \
            VyralX/tests/test_vyr053_pool.py \
            VyralX/tests/test_vyr057_pool.py \
            VyralX/tests/test_vyr055_refresh3_pool.py \
            VyralX/tests/test_vyr061_best_take_gate.py \
            VyralX/tests/test_vyr064_pd_whitelist.py \
            VyralX/tests/test_vyr074_mapping.py \
            VyralX/tests/test_vyr065_niche_guard.py \
            VyralX/tests/test_vyr062_stick_figure_series.py \
            VyralX/tests/test_vyr081_gta6_series.py
      - name: Compile fresh research and deployed voice wiring
        run: >-
          python -m compileall -q IntelX/intelx/api/router.py
          IntelX/intelx/api/live_research_task.py FRIDAY/src/friday/voice

