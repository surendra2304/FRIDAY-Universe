name: Owner Workflow Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'FRIDAY/src/**'
      - 'FRIDAY/tests/**'
      - 'Forge/app/**'
      - 'Forge/tests/**'
      - 'Inference/app/services/**'
      - 'Inference/tests/test_forge_goal_and_test_generation.py'
      - 'Inference/tests/test_python_fence_boundaries.py'
      - 'Memora/core/memory/search_service.py'
      - 'Memora/tests/test_direct_evidence_ranking.py'
      - 'IntelX/intelx/api/**'
      - 'VyralX/app/**'
      - 'VyralX/tests/**'
      - 'tests/test_live_research_task_contract.py'
      - 'tests/test_safe_fleet_deploy.py'
      - '.github/workflows/deploy-monorepo.yml'
      - '.github/workflows/owner-workflows.yml'
  push:
    branches: [main, 'arena/TASK-WF-004-*']
    paths:
      - 'FRIDAY/src/**'
      - 'FRIDAY/tests/**'
      - 'Forge/app/**'
      - 'Forge/tests/**'
      - 'Inference/app/services/**'
      - 'Inference/tests/test_forge_goal_and_test_generation.py'
      - 'Inference/tests/test_python_fence_boundaries.py'
      - 'Memora/core/memory/search_service.py'
      - 'Memora/tests/test_direct_evidence_ranking.py'
      - 'IntelX/intelx/api/**'
      - 'VyralX/app/**'
      - 'VyralX/tests/**'
      - 'tests/test_live_research_task_contract.py'
      - 'tests/test_safe_fleet_deploy.py'
      - '.github/workflows/deploy-monorepo.yml'
      - '.github/workflows/owner-workflows.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install workflow contract dependencies
        run: >-
          python -m pip install pytest pytest-asyncio fastapi uvicorn httpx
          pydantic-settings 'sqlalchemy[asyncio]' rich python-dotenv psutil beautifulsoup4
          google-genai 'livekit-agents>=1,<2' mcp icalendar recurring-ical-events
          pillow pyperclip openai numpy PyYAML google-api-python-client anthropic aiosqlite
      - name: Exercise four workflow and authority contracts (no external calls)
        run: |
          python -m pytest -q \
            tests/test_live_research_task_contract.py \
            tests/test_safe_fleet_deploy.py \
            FRIDAY/tests/test_four_owner_workflows.py \
            FRIDAY/tests/test_persona_clock_annotations.py \
            FRIDAY/tests/test_intelx_research_dispatch.py \
            FRIDAY/tests/test_forge_code_dispatch.py \
            FRIDAY/tests/test_forge_artifact_receipts.py \
            FRIDAY/tests/test_batch7_agent_depth_2.py \
            FRIDAY/tests/test_batch4_memory_brain.py \
            FRIDAY/tests/test_memory_commands.py \
            FRIDAY/tests/test_voice_tool_security.py \
            FRIDAY/tests/test_api_origin_enforcement.py \
            FRIDAY/tests/test_batch3_delegations.py \
            FRIDAY/tests/test_batch3_part2.py \
            FRIDAY/tests/test_memora_hardening.py \
            FRIDAY/tests/test_intent_classifier_tier.py \
            FRIDAY/tests/test_gemini_tool_schema_validity.py \
            FRIDAY/tests/test_rel_010_pool_exhaustion.py \
            FRIDAY/tests/test_rel018_scrubber_prose.py
      - name: Generated-code ingestion and saved verification status
        env:
          PYTHONPATH: Forge
        run: |
          python -m pip install -r Forge/requirements-verification.txt
          python -m pytest -q Forge/tests/unit/test_response_parser.py \
            Forge/tests/unit/test_parser_and_webstudio_regressions.py \
            Forge/tests/unit/test_generated_test_ingestion.py \
            Forge/tests/unit/test_gate_blocked_rel026.py \
            Forge/tests/unit/test_tester_synthesis_note_rel023.py \
            Forge/tests/unit/test_delegate_verification_status.py \
            Forge/tests/unit/test_missing_test_truthfulness.py \
            Forge/tests/unit/test_verification.py \
            Forge/tests/unit/test_goal_fidelity_contract.py \
            Forge/tests/unit/test_context_manager.py \
            Forge/tests/unit/test_repair_preservation_and_embedded_tests.py \
            Forge/tests/unit/test_generation_boundary_regressions.py \
            Forge/tests/unit/test_release_consent.py \
            Forge/tests/unit/test_github_tool.py \
            Forge/tests/unit/test_execution_security_gates.py \
            Forge/tests/unit/test_delivery_verification_consistency.py \
            Forge/tests/unit/test_source_backed_repair.py \
            Forge/tests/unit/test_artifact_receipts.py \
            Forge/tests/unit/test_portable_fixture_repair.py \
            Forge/tests/unit/test_source_bound_receipts.py \
            Forge/tests/unit/test_task_forge_002_developer_retry.py \
            Forge/tests/unit/test_task_forge_002_recovery_escalation.py \
            Forge/tests/unit/test_task_forge_002_routing.py \
            Forge/tests/unit/test_task_forge_002_truthful_completion.py \
            Forge/tests/unit/test_developer_ai_universe.py
      - name: Direct memory evidence outranks graph-only context
        env:
          PYTHONPATH: Memora
          MEMORA_ENV: testing
          ENVIRONMENT: testing
          MEMORA_EMBEDDING_MODE: hashing
        run: |
          python -m pip install -r Memora/requirements.txt
          python -m pytest -q Memora/tests/test_direct_evidence_ranking.py \
            Memora/tests/test_hybrid_search.py \
            Memora/tests/test_oracle_vector_tenant_isolation.py \
            Memora/tests/test_cross_tenant_context_isolation.py \
            Memora/tests/test_memory_access_controller_auth.py
      - name: Goal-specific code and honest generated-test contracts
        env:
          PYTHONPATH: Inference
        run: |
          python -m pip install -r Inference/requirements.txt
          python -m pytest -q Inference/tests/test_forge_goal_and_test_generation.py \
            Inference/tests/test_test_generation_reliability_rel026.py \
            Inference/tests/test_unified_manager_cache_scope.py \
            Inference/tests/test_forge_code_review_is_evidence_based.py \
            Inference/tests/test_python_fence_boundaries.py \
            Inference/tests/test_forge_output_is_verified.py \
            Inference/tests/test_source_repair_context.py
      - name: Review-required project persistence and worker boundaries
        env:
          APP_ENV: development
          DATA_DIR: /tmp/vyralx-contract-data
          MEDIA_DIR: /tmp/vyralx-contract-media
          RENDER_DIR: /tmp/vyralx-contract-renders
          PYTHONPATH: VyralX
        run: |
          python -m pytest -q VyralX/tests/test_review_required_project.py \
            VyralX/tests/test_project_pipeline_e2e.py VyralX/tests/test_project_review.py
      - name: Compile fresh research and deployed voice wiring
        run: >-
          python -m compileall -q IntelX/intelx/api/router.py
          IntelX/intelx/api/live_research_task.py FRIDAY/src/friday/voice
