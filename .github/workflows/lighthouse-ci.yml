name: Lighthouse CI

# Checklist D16 (MASTER_COMPLETION_CHECKLIST) — Batch 8, ZAI Agent 2.
# Performance budget: Lighthouse >= 90 on the deployed build. The static
# export is committed at FRIDAY/ui/out/ (built locally + checked in), so
# Lighthouse audits that directly — no CI build step (which was OOM-failing
# on the runner). Runs on push to main + PRs touching the UI.

on:
  pull_request:
    paths:
      - "FRIDAY/ui/**"
      - ".github/workflows/lighthouse-ci.yml"
      - ".github/lighthouserc.json"
  push:
    branches: [main]
    paths:
      - "FRIDAY/ui/out/**"
      - ".github/workflows/lighthouse-ci.yml"
      - ".github/lighthouserc.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit (>= 90 all categories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Lighthouse CI on the committed static export
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Assert budget (>= 90 on all categories)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          assert: true
