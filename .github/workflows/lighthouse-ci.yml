name: Lighthouse CI

# Checklist D16 (MASTER_COMPLETION_CHECKLIST) — Batch 8, ZAI Agent 2.
# Performance budget: Lighthouse >= 90 on the deployed build. The static
# export is committed at FRIDAY/ui/out/ — Lighthouse audits it directly.
# Uses the official @lhci/cli (no third-party action wrapper — the
# treosh action versions were unstable in CI).

on:
  pull_request:
    paths:
      - "FRIDAY/ui/out/**"
      - ".github/workflows/lighthouse-ci.yml"
      - ".github/lighthouserc.json"
  push:
    branches: [main]
    paths:
      - "FRIDAY/ui/out/**"
      - ".github/workflows/lighthouse-ci.yml"
      - ".github/lighthouserc.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit (>= 90 all categories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI (audit the committed static export)
        run: lhci autorun --config=.github/lighthouserc.json

      - name: Assert budget (>= 90 on all categories)
        run: lhci assert --config=.github/lighthouserc.json
