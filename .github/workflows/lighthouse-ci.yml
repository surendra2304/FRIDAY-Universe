name: Lighthouse CI

# Checklist D16 (MASTER_COMPLETION_CHECKLIST) — Batch 8, ZAI Agent 2.
# Performance budget: Lighthouse >= 90 on the deployed build. Runs on every
# push to main (after the build succeeds) and on PRs that touch the UI.
# Uploads the HTML report as a 30-day artifact; fails the run if any
# category drops below 90.

on:
  pull_request:
    paths:
      - "FRIDAY/ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  push:
    branches: [main]
    paths:
      - "FRIDAY/ui/**"
      - ".github/workflows/lighthouse-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit (>= 90 all categories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FRIDAY/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: FRIDAY/ui
        run: npm ci

      - name: Build the UI (static export)
        working-directory: FRIDAY/ui
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Assert budget (>= 90 on all categories)
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./.github/lighthouserc.json
          assert: true
