name: Monorepo Structure and Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate fleet layout and mirror safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "pytest>=8.3,<9" "pytest-asyncio>=0.24,<2" "redis>=5,<7" "prometheus-client>=0.20" "structlog>=24" "pydantic>=2.6,<3" "pydantic-settings>=2.2,<3" "starlette>=0.37,<2" "fastapi>=0.110,<1" "SQLAlchemy>=2.0,<3" "httpx>=0.27,<1" "reportlab>=4,<5" "pypdf>=5,<7"

      - name: Run regression tests
        env:
          DATABASE_URL: oracle+oracledb://mock:mock@localhost:1521/FREE
        run: python -m pytest -q tests

      - name: Compile shared coordinator and its integrated call sites
        run: python -m compileall -q mesh Forge/app/verification/engine.py Futuris/futuris/core/pipeline.py Sentinel/sentinel/core/orchestrator/executor.py

      - name: Validate all ten agent roots and workflow syntax
        run: python scripts/validate_fleet.py
