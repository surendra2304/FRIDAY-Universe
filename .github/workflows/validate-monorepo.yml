name: Monorepo Structure and Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate fleet layout and mirror safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run regression tests
        env:
          DATABASE_URL: oracle+oracledb://mock:mock@localhost:1521/FREE
        run: python -m pytest -q tests

      - name: Compile shared coordinator and its integrated call sites
        run: python -m compileall -q mesh Forge/app/verification/engine.py Futuris/futuris/core/pipeline.py Sentinel/sentinel/core/orchestrator/executor.py

      - name: Validate all ten agent roots and workflow syntax
        run: python scripts/validate_fleet.py
