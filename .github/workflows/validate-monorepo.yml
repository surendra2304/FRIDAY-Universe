name: Monorepo Structure and Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate fleet layout and mirror safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run regression tests
        env:
          DATABASE_URL: oracle+oracledb://mock:mock@localhost:1521/FREE
        # TASK-REL-081: the runner tees pytest output to a log and, on
        # failure, writes a self-describing summary (run id, failing step,
        # exit code, log tail; exit 134 gets the REL-070 signature check)
        # to the step log and $GITHUB_STEP_SUMMARY. The exit code is
        # preserved, so the gate still fails exactly as before.
        run: python scripts/ci_gate_test_runner.py

      - name: Compile shared coordinator and its integrated call sites
        run: python -m compileall -q mesh Forge/app/verification/engine.py Futuris/futuris/core/pipeline.py Sentinel/sentinel/core/orchestrator/executor.py

      - name: Validate all ten agent roots and workflow syntax
        # TASK-REL-085: on failure the wrapper prints the failing check +
        # offending lines into the check-run summary, so the precise
        # failing step is recoverable without sign-in-gated logs.
        # (The regression-test step above already has this contract via
        # the REL-081 runner, scripts/ci_gate_test_runner.py.)
        run: |
          python scripts/ci_failure_summary.py \
            --check "fleet-layout" \
            --step "Validate all ten agent roots and workflow syntax" \
            --workflow ".github/workflows/validate-monorepo.yml" \
            --job "Validate fleet layout and mirror safety" \
            -- python scripts/validate_fleet.py
