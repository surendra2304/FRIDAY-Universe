name: Voice startup regressions
on:
  pull_request:
    paths:
      - 'FRIDAY/ui/components/VoiceCall.tsx'
      - 'scripts/verification/runtime_audit/**'
      - '.github/workflows/voice-startup-regressions.yml'
      - 'tests/test_runtime_audit_contract.py'
  push:
    branches: [main]
    paths:
      - 'FRIDAY/ui/components/VoiceCall.tsx'
      - 'scripts/verification/runtime_audit/**'
      - '.github/workflows/voice-startup-regressions.yml'
      - 'tests/test_runtime_audit_contract.py'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  voice-startup-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # TASK-REL-120: per-job duration reporting.
      - name: Record job start time
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install isolated regression dependencies
        working-directory: scripts/verification/runtime_audit
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual-source startup and intentional-end regressions
        working-directory: scripts/verification/runtime_audit
        run: npm test
      - name: Install dashboard dependencies
        working-directory: FRIDAY/ui
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build dashboard export
        working-directory: FRIDAY/ui
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify audit receipts fail closed on missing measurements
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_runtime_audit_contract.py

      - name: Report job duration
        if: always()
        run: |
          end=$(date +%s)
          start=${JOB_START_EPOCH:-$end}
          elapsed=$((end - start))
          echo "Job duration: ${elapsed}s"
          echo "- Job duration: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
