name: Cost Audit Reminder

# Checklist H10 (MASTER_COMPLETION_CHECKLIST) — Batch 8, ZAI Agent 2.
# Opens an issue on the first Monday of every quarter (Jan/Apr/Jul/Oct) as a
# reminder to run the $0-cost audit (docs/infra/COST_AUDIT_H10.md).

on:
  schedule:
    # First Monday of the month at 09:00 UTC — the issue body checks if it's
    # a quarter month (Jan/Apr/Jul/Oct); if not, the issue self-closes.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  reminder:
    name: Open quarterly cost-audit issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open issue (quarter months only)
        uses: actions/github-script@v7
        with:
          script: |
            const month = new Date().getMonth() + 1;  // 1=Jan
            const quarterMonths = [1, 4, 7, 10];
            if (!quarterMonths.includes(month)) {
              core.info("Not a quarter month — skipping.");
              return;
            }
            const quarter = ["Q1", "Q2", "Q3", "Q4"][Math.floor((month - 1) / 3)];
            const year = new Date().getFullYear();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[COST AUDIT ${quarter} ${year}] $0-cost audit due`,
              body: [
                `**Checklist H10 — quarterly $0-cost audit (due first Monday of ${quarter} ${year}).**`,
                ``,
                `Run the audit in \`docs/infra/COST_AUDIT_H10.md\` and post the result as a comment:`,
                ``,
                `1. Oracle Always Free usage (VMs, storage, DB)`,
                `2. Third-party free-tier usage (Groq, LiveKit, GitHub Actions, Vercel, Gemini)`,
                `3. No PAYG services configured (grep for payg/pay_as_you_go/pricing_tier)`,
                `4. No accidental compute spend`,
                `5. Storage growth bounded`,
                ``,
                `The F3 usage dashboard (\`/api/agents/usage\`) is the live source for #2.`,
                `The D-015 fail-closed guard is the live source for #3 (Stratex demo key).`,
                ``,
                `Close this issue when the audit is complete and the changelog in`,
                `\`docs/infra/COST_AUDIT_H10.md\` is updated.`,
              ].join("\n"),
              labels: ["cost-audit", "infra"],
            });
