name: Bridge Recover (manual, emergency)

# One-purpose emergency workflow, added 2026-11-19 under the owner's direct
# order after friday-bridge.service on Server 2 failed to return from the
# Python 3.12 window restart (down since 10:52 IST; the bridge is the fleet's
# only control channel, so recovery has to ride the fleet's own CI SSH path —
# the same pattern as rollback-deploy.yml and fleet-live-validation.yml).
# Manual dispatch only. Restores the pre-window (Python 3.10) unit file from
# its .bak-py310 backup, restarts the bridge, and prints before/after state
# plus the journal into the run log. Remove after the bridge is restored.

on:
  workflow_dispatch:

jobs:
  recover-bridge:
    name: Restore friday-bridge on Server 2
    runs-on: ubuntu-latest
    steps:
      - name: Restore and restart friday-bridge (Server 2)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "=== bridge state BEFORE ==="
            systemctl is-active friday-bridge.service || true
            systemctl show friday-bridge.service --property=NRestarts --value || true
            sudo -n journalctl -u friday-bridge.service -n 60 --no-pager || true
            echo "=== unit files present ==="
            ls -la /etc/systemd/system/friday-bridge.service* || true
            echo "=== current unit ExecStart ==="
            grep -E '^ExecStart' /etc/systemd/system/friday-bridge.service || true
            echo "=== restore pre-window unit backup ==="
            if [ -f /etc/systemd/system/friday-bridge.service.bak-py310 ]; then
              sudo -n cp /etc/systemd/system/friday-bridge.service.bak-py310 /etc/systemd/system/friday-bridge.service
              echo "restored from .bak-py310; ExecStart now:"
              grep -E '^ExecStart' /etc/systemd/system/friday-bridge.service || true
              sudo -n systemctl daemon-reload
            else
              echo "NO .bak-py310 backup found - restarting the current unit unchanged"
            fi
            sudo -n systemctl restart friday-bridge.service || true
            sleep 15
            echo "=== bridge state AFTER ==="
            systemctl is-active friday-bridge.service || true
            sudo -n journalctl -u friday-bridge.service -n 30 --no-pager || true
