name: Collaboration Registry Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/collaboration/**"
      - "docs/MASTER_PLAN.md"
      - "docs/handoff.md"
      - "docs/ARCHITECTURE_AS_BUILT.md"
      - "scripts/validate_collaboration.py"
      - "scripts/tests/test_validate_collaboration.py"
      - ".github/workflows/collaboration-registry.yml"
  push:
    branches: [main]
    paths:
      - "docs/collaboration/**"
      - "docs/MASTER_PLAN.md"
      - "docs/handoff.md"
      - "docs/ARCHITECTURE_AS_BUILT.md"
      - "scripts/validate_collaboration.py"
      - "scripts/tests/test_validate_collaboration.py"
      - ".github/workflows/collaboration-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate roster, task IDs and file ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install "PyYAML>=6.0,<7.0"

      - name: Validate collaboration registry
        # TASK-REL-085: on failure the wrapper prints the failing check +
        # offending lines into the check-run summary, so the precise
        # failing step is recoverable without sign-in-gated logs.
        run: |
          python scripts/ci_failure_summary.py \
            --check "roster-validator" \
            --step "Validate collaboration registry" \
            --workflow ".github/workflows/collaboration-registry.yml" \
            --job "Validate roster, task IDs and file ownership" \
            -- python scripts/validate_collaboration.py

      - name: Run validator regression tests (TASK-REL-069 fixtures)
        # TASK-REL-085: same failure-summary contract as above.
        run: |
          python scripts/ci_failure_summary.py \
            --check "roster-validator" \
            --step "Run validator regression tests (TASK-REL-069 fixtures)" \
            --workflow ".github/workflows/collaboration-registry.yml" \
            --job "Validate roster, task IDs and file ownership" \
            -- python scripts/tests/test_validate_collaboration.py
