name: Collaboration Registry Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/collaboration/**"
      - "docs/MASTER_PLAN.md"
      - "docs/handoff.md"
      - "docs/ARCHITECTURE_AS_BUILT.md"
      - "scripts/validate_collaboration.py"
      - ".github/workflows/collaboration-registry.yml"
  push:
    branches: [main]
    paths:
      - "docs/collaboration/**"
      - "docs/MASTER_PLAN.md"
      - "docs/handoff.md"
      - "docs/ARCHITECTURE_AS_BUILT.md"
      - "scripts/validate_collaboration.py"
      - ".github/workflows/collaboration-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate roster, task IDs and file ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install "PyYAML>=6.0,<7.0"

      - name: Validate collaboration registry
        run: python scripts/validate_collaboration.py
