name: Monorepo Structure and Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo-only policy and workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "pytest>=8.3,<9"

      - name: Run repository regression tests
        run: python -m pytest -q tests

      - name: Validate repository and workflow safety
        run: python scripts/validate_fleet.py

      - name: Assert standalone mirroring remains disabled
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/mirror-subrepos.yml
          grep -q 'workflow_dispatch:' "$workflow"
          if grep -Eq '^[[:space:]]*(push|pull_request):|git[[:space:]]+push|rsync|gh[[:space:]]+pr[[:space:]]+create|GH_PAT_MIRROR' "$workflow"; then
            echo "::error::The mirror workflow must remain manual-only and perform no cross-repository writes."
            exit 1
          fi
