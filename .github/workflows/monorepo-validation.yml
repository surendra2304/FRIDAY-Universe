name: Monorepo Structure and Safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo-only policy and workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRIDAY_UNIVERSE_TEST_REDIS_URL: redis://localhost:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "pytest>=8.3,<9" "pytest-asyncio>=0.24,<2" "redis>=5,<7" "prometheus-client>=0.20" "structlog>=24" "pydantic>=2.6,<3" "pydantic-settings>=2.2,<3" "starlette>=0.37,<2" "reportlab>=4,<5" "pypdf>=5,<7"

      - name: Run repository and cancellable CPU-worker tests
        env:
          PYTHONPATH: ${{ github.workspace }}/Futuris
        run: python -m pytest -q tests Futuris/tests/infra/test_cpu_process.py --confcutdir=Futuris/tests/infra

      - name: Validate repository and workflow safety
        run: python scripts/validate_fleet.py

      - name: Validate production Compose configuration
        shell: bash
        env:
          FRIDAY_UNIVERSE_REDIS_PASSWORD: ci-url-safe-password-for-compose-validation
        run: |
          set -euo pipefail
          # Production env files are intentionally untracked because they hold
          # credentials. Empty placeholders let Compose validate references
          # without copying any real secrets into CI.
          for agent in FRIDAY Inference Memora Stratex Forge Cortex Sentinel IntelX Futuris VyralX; do
            touch "$agent/.env"
          done
          docker compose -f docker-compose.oracle.yml config --quiet

      - name: Build and scan the sanitized architecture PDF
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/FRIDAY_UNIVERSE_MASTER_ARCHITECTURE.pdf"
          python scripts/generate_master_architecture_pdf.py --output "$output"
          python - "$output" <<'PY'
          import re
          import sys
          from pypdf import PdfReader

          reader = PdfReader(sys.argv[1])
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          prohibited = (
              r"FridayUniverse2026",
              r"sentinel_jF-[A-Za-z0-9_-]{16,}",
              r"friday_Kh[A-Za-z0-9_-]{16,}",
              r"inference_Jrn[A-Za-z0-9_-]{16,}",
              r"intelx_3l[A-Za-z0-9_-]{16,}",
              r"memora_kz[A-Za-z0-9_-]{16,}",
              r"vyralx_sec_[A-Za-z0-9]{16,}",
              r"SENTINEL_AUDIT_(?:HMAC|SIGNING)_KEY=[A-Fa-f0-9]{32,}",
          )
          matches = [pattern for pattern in prohibited if re.search(pattern, text)]
          if matches:
              raise SystemExit(f"PDF contains {len(matches)} prohibited credential pattern(s)")
          if not text.strip():
              raise SystemExit("Generated architecture PDF contains no extractable text")
          print(f"Sanitized PDF verified: {len(reader.pages)} pages")
          PY

      - name: Upload sanitized architecture PDF
        uses: actions/upload-artifact@v4
        with:
          name: friday-universe-master-architecture
          path: ${{ runner.temp }}/FRIDAY_UNIVERSE_MASTER_ARCHITECTURE.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Assert standalone mirroring remains disabled
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/mirror-subrepos.yml
          grep -q 'workflow_dispatch:' "$workflow"
          if grep -Eq '^[[:space:]]*(push|pull_request):|git[[:space:]]+push|rsync|gh[[:space:]]+pr[[:space:]]+create|GH_PAT_MIRROR' "$workflow"; then
            echo "::error::The mirror workflow must remain manual-only and perform no cross-repository writes."
            exit 1
          fi