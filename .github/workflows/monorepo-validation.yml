name: Monorepo Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Validate agent structure and sync safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify ten agent roots
        shell: bash
        run: |
          set -euo pipefail
          agents=(FRIDAY Inference Memora Stratex Forge Cortex Sentinel IntelX Futuris VyralX)
          for agent in "${agents[@]}"; do
            test -d "$agent" || { echo "::error::Missing agent directory: $agent"; exit 1; }
            git ls-files --error-unmatch "$agent" >/dev/null
          done

      - name: Guard against destructive subtree mirroring
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/mirror-subrepos.yml
          test -f "$workflow"
          if grep -En 'git push .*--force|git push .*:main.*--force|split-.*:main.*--force' "$workflow"; then
            echo "::error::Destructive force-push mirroring is forbidden."
            exit 1
          fi
          grep -q 'pull request\|pull-request\|pr create' "$workflow" || {
            echo "::error::Mirror workflow must publish reviewable PRs."
            exit 1
          }
          grep -q 'GH_PAT_MIRROR' "$workflow" || {
            echo "::error::Mirror workflow must require explicit cross-repository write credentials."
            exit 1
          }
