name: Flaky Quarantine Nightly Gate

# TASK-REL-121: quarantined tests are skipped in PR CI and run here, on
# the nightly gate, unskipped. The full root suite runs (not only the
# quarantined nodeids) because the first entry — the REL-070 SIGABRT
# shutdown race — only manifests in full-suite context; the REL-081
# runner banners any exit-134 recurrence with its signature check.

on:
  schedule:
    - cron: '23 3 * * *' # 03:23 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flaky-quarantine-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly gate — quarantined tests run unskipped
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRIDAY_FLAKY_QUARANTINE_MODE: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate quarantine list (owner + expiry per entry)
        run: python scripts/flaky_quarantine.py --check

      - name: List quarantined nodeids covered by this run
        run: python scripts/flaky_quarantine.py --nodeids

      - name: Run root suite unskipped (REL-081 runner)
        env:
          DATABASE_URL: oracle+oracledb://mock:mock@localhost:1521/FREE
        run: python scripts/ci_gate_test_runner.py
