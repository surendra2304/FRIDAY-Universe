# FRIDAY Universe — Agent Manifest
# This is the SINGLE SOURCE OF TRUTH for agent count, roles, ports, and URLs.
# All docs, compose files, mesh auth maps, and tests must validate against this.
# Doc drift should become a failing test, not a comment.

version: "3.0.0"
total_agents: 9
layers:
  basic: 9
  advanced: 9
  deep: 9

agents:
  cortex:
    name: "Cortex"
    domain: "Decision Intelligence"
    layers: 3
    engines: ["decision", "recommender", "predictive_analytics", "foresight"]
    port: 8009
    memory_limit: "200M"
    status: "production"

  inference:
    name: "Inference"
    domain: "Reasoning"
    layers: 3
    engines: ["bayesian", "causal", "argumentation", "probabilistic_logic", "metacognitive", "abductive", "temporal", "counterfactual", "analogical"]
    port: 8001
    memory_limit: "180M"
    status: "production"

  memora:
    name: "Memora"
    domain: "Memory"
    layers: 3
    engines: ["tf_idf", "knowledge_graph", "consolidation", "supermemo", "episodic", "semantic", "procedural", "working_memory", "reconsolidation", "cross_modal"]
    port: 8002
    memory_limit: "200M"
    status: "production"

  stratex:
    name: "Stratex"
    domain: "Trading"
    layers: 3
    engines: ["trading", "options_bs", "risk_var", "sentiment", "order_flow", "patterns"]
    port: 8003
    memory_limit: "180M"
    status: "production"

  forge:
    name: "Forge"
    domain: "Code"
    layers: 3
    engines: ["code_engine", "auto_repair", "security_scanner", "deps", "refactor"]
    port: 8006
    memory_limit: "180M"
    status: "production"

  sentinel:
    name: "Sentinel"
    domain: "Security"
    layers: 3
    engines: ["security_engine", "siem", "vuln_mgmt", "compliance", "incident_playbook"]
    port: 8008
    memory_limit: "200M"
    status: "production"

  intelx:
    name: "IntelX"
    domain: "Threat Intelligence"
    layers: 3
    engines: ["threat_intel", "darkweb", "threat_forecast", "quality", "disinfo", "supply_chain"]
    port: 8005
    memory_limit: "180M"
    status: "production"

  futuris:
    name: "Futuris"
    domain: "Forecasting"
    layers: 3
    engines: ["forecast", "quantum", "ensemble", "stress_test", "realtime_impact"]
    port: 8004
    memory_limit: "180M"
    status: "production"

  vyralx:
    name: "VyralX"
    domain: "Content"
    layers: 3
    engines: ["content", "audience", "growth", "calendar", "moderation"]
    port: 8010
    memory_limit: "250M"
    status: "production"

# Resource budget table — prove the fleet fits on the target host
resource_budget:
  target_host:
    cpu: "2 OCPU"
    ram_gb: 12
    os: "Oracle Linux ARM64 / Ubuntu 22.04 AMD64"
  total_memory_limit: "1630M"  # Sum of all agent memory_limits
  memory_utilization_pct: 13.6  # 1630M / 12288M
  always_on_agents: 7
  on_demand_agents: 2
  notes: >
    Total memory limit of 1630M fits comfortably within 12GB target.
    2 agents (VyralX, Cortex) are on-demand due to higher memory needs.
    Full fleet boot proven on Oracle Cloud VM.Standard.A1.Flex (2 OCPU, 12GB).

# Proven vertical slice (review 2: breadth vs depth)
proven_vertical:
  name: "security_incident_response"
  description: >
    FRIDAY receives security alert → Sentinel detects threat → IntelX correlates indicators
    → Forge scans code → Sentinel manages vulnerabilities → Compliance audit → Response returned
  agents_involved: [sentinel, intelx, forge]
  layers_used: [basic, deep]
  endpoint: "/api/workflow/deep/security"
  status: "proven"
  test_file: "tests/test_real_deep_workflow_http.py"
