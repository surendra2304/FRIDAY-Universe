[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futuris"
version = "2.0.0"
description = "Calibrated predictive intelligence and forecasting platform"
readme = "README.md"
requires-python = ">=3.11"
# TASK-SEN-012 (2026-11-15): fleet-shared floors reconciled with SEN-002's live-venv probe; see docs/DEPENDENCY_LOCKS.md.
dependencies = [
    "fastapi>=0.161.1,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.28,<3.0.0",
    "oracledb>=2.5.0,<27.0.0",
    "alembic>=1.13.1,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0,<1.0.0",
    "redis>=5.0,<7.0",
    "statsforecast>=1.7.0",
    "pandas>=2.2.0",
    "pyarrow>=25.0.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.2.4",
    "prometheus-client>=0.20.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# TASK-IG-FUT-01 post-ARM adoption set. NEVER install on the current
# fleet: the measured SDK import peaks at ~996 MB RSS on a 956 MB host
# (docs/DATA_BACKBONE_IGFUT01.md). Install ONLY on the ARM server
# (pip install 'futuris[openbb]'), then pin the resolved set.
openbb = [
    "openbb>=5.0,<6.0",
    "openbb-yfinance",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG"]
ignore = ["B008"]  # FastAPI dependency defaults are function calls by design

[tool.ruff.lint.per-file-ignores]
# Tests intentionally declare fixtures and protocol stubs whose arguments are
# unused by the stand-in implementation.
"tests/**" = ["ARG001", "ARG002", "ARG005"]
# Scripts print to stdout as their user interface, and some adjust sys.path
# before importing project modules.
"scripts/**" = ["T201", "ARG001", "ARG002", "ARG005", "E402"]
# Alembic migration modules import the dialect types they need at module level
# and are executed by Alembic rather than imported normally.
"alembic/**" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
xfail_strict = true
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["futuris"]