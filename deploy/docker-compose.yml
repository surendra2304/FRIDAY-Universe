version: '3.8'

networks:
  friday_mesh:
    driver: bridge

services:
  # 1. Master Command Center & Gateway
  friday:
    build:
      context: ./FRIDAY
      dockerfile: Dockerfile
    container_name: friday_core
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - .env.production
    environment:
      - PORT=10000
      - HOST=0.0.0.0
      - CORTEX_URL=http://cortex:8000
      - FORGE_URL=http://forge:8000
      - FUTURIS_URL=http://futuris:8000
      - INFERENCE_URL=http://inference:8000
      - INTELX_URL=http://intelx:8000
      - MEMORA_URL=http://memora:8000
      - SENTINEL_URL=http://sentinel:8000
      - STRATEX_URL=http://stratex:8000
      - FRIDAY_STRATEX_URL=http://stratex:8000
    networks:
      - friday_mesh

  # 2. Cortex
  cortex:
    build:
      context: ./Cortex
      dockerfile: Dockerfile
    container_name: friday_cortex
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 3. Forge
  forge:
    build:
      context: ./Forge
      dockerfile: Dockerfile
    container_name: friday_forge
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 4. Futuris
  futuris:
    build:
      context: ./Futuris
      dockerfile: Dockerfile
    container_name: friday_futuris
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 5. Inference
  inference:
    build:
      context: ./Inference
      dockerfile: Dockerfile
    container_name: friday_inference
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 6. IntelX
  intelx:
    build:
      context: ./IntelX
      dockerfile: Dockerfile
    container_name: friday_intelx
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
      - ENV=development
      - ENVIRONMENT=development
    networks:
      - friday_mesh

  # 7. Memora
  memora:
    build:
      context: ./Memora
      dockerfile: Dockerfile
    container_name: friday_memora
    restart: unless-stopped
    ports:
      - "8006:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - ENV=development
    networks:
      - friday_mesh

  # 8. Sentinel
  sentinel:
    build:
      context: ./Sentinel
      dockerfile: Dockerfile
    container_name: friday_sentinel
    restart: unless-stopped
    ports:
      - "8007:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - ENV=development
      - SENTINEL_AUDIT_SIGNING_KEY=4a8f9b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4
      - SENTINEL_AUDIT_HMAC_KEY=4a8f9b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4
    networks:
      - friday_mesh

  # 9. Stratex
  stratex:
    build:
      context: ./Stratex
      dockerfile: Dockerfile
    container_name: friday_stratex
    restart: unless-stopped
    ports:
      - "8008:8000"
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh
