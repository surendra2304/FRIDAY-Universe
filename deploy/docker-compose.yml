version: '3.8'

networks:
  friday_mesh:
    driver: bridge

services:
  # 1. Master Command Center & Gateway
  friday:
    build:
      context: ./FRIDAY
      dockerfile: Dockerfile
    container_name: friday_core
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - .env.production
    environment:
      - PORT=10000
      - HOST=0.0.0.0
      - CORTEX_URL=http://cortex:8000
      - FORGE_URL=http://forge:8000
      - FUTURIS_URL=http://futuris:8000
      - INFERENCE_URL=http://inference:8000
      - INTELX_URL=http://intelx:8000
      - MEMORA_URL=http://memora:8000
      - SENTINEL_URL=http://sentinel:8000
      - STRATEX_URL=http://stratex:8000
      - FRIDAY_STRATEX_URL=http://stratex:8000
    networks:
      - friday_mesh

  # 2. Cortex
  cortex:
    build:
      context: ./Cortex
      dockerfile: Dockerfile
    container_name: friday_cortex
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 3. Forge
  forge:
    build:
      context: ./Forge
      dockerfile: Dockerfile
    container_name: friday_forge
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 4. Futuris
  futuris:
    build:
      context: ./Futuris
      dockerfile: Dockerfile
    container_name: friday_futuris
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 5. Inference
  inference:
    build:
      context: ./Inference
      dockerfile: Dockerfile
    container_name: friday_inference
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh

  # 6. IntelX
  intelx:
    build:
      context: ./IntelX
      dockerfile: Dockerfile
    container_name: friday_intelx
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
      - ENV=production
      - ENVIRONMENT=production
    networks:
      - friday_mesh

  # 7. Memora
  memora:
    build:
      context: ./Memora
      dockerfile: Dockerfile
    container_name: friday_memora
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - ENV=production
    networks:
      - friday_mesh

  # 8. Sentinel
  sentinel:
    build:
      context: ./Sentinel
      dockerfile: Dockerfile
    container_name: friday_sentinel
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - ENV=development
      - SENTINEL_AUDIT_SIGNING_KEY=${SENTINEL_AUDIT_SIGNING_KEY:?Set a private audit signing key in deploy/.env.production}
      - SENTINEL_AUDIT_HMAC_KEY=${SENTINEL_AUDIT_HMAC_KEY:?Set a private audit HMAC key in deploy/.env.production}
    networks:
      - friday_mesh

  # 9. Stratex
  stratex:
    build:
      context: ./Stratex
      dockerfile: Dockerfile
    container_name: friday_stratex
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8000
    networks:
      - friday_mesh
