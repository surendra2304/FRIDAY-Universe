    defect: "Follow-up split out of TASK-REL-013's verified remainder. REL-013 unified Memora's semantic write/read paths on the Oracle vector store, but in SearchService.hybrid_search's merged result list a fresh fact still surfaces at position 53 (limit=100) on a broad paraphrase query where it is the vector adapter's semantic rank 1 (sim 0.76): 36 legacy graph-connected records saturate final_score at 1.0 via graph boosts (+0.26..+0.69). Code-verified mechanism at main 4165fef: the merge adds the graph term RAW (graph_weight * g_boost) while the semantic/keyword legs are RRF terms damped by 1/(rrf_k + rank); the sum is then scaled by rrf_k/2 (=30) and capped at 1.0. With the shipped config (dense_vector 0.6, bm25 0.3, graph_walk 0.1, rrf_k 60), a rank-1 semantic + rank-1 keyword hit scores ~0.44, while g_boost >= ~0.19 alone pins a record at 1.0 — and GraphService.get_graph_neighbors accumulates weight*0.15 per incident edge with no bound, so hub records reach g_boost 0.26..0.69. FRIDAY's recall reads with small limits (5 for normal recall, 25 for mutation targeting in FRIDAY/src/friday/memory/memora_client.py), so a rank-53 fact is invisible in production recall. Same surface as TASK-REL-014's recall-window residual."
