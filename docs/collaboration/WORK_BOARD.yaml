    defect: "The routing ladder is deterministic keyword tables: phrasings no table matches fall through to the generic LLM tool loop (multi-second, unsteered), and phrasings matching >=2 tables are resolved by score arithmetic — the documented misroute class (research->VISION_MODEL, trading-intent->launcher, 'write a script'->video-script engine). required_tools on the deterministic router was telemetry-only; the generic loop never saw it."
    acceptance:
      - "Fail-open invariant: provider timeout/error/malformed output returns None and the pipeline proceeds byte-identical to pre-tier behaviour; the classifier can only add information, never block a turn."
      - "Weak-signal gate: fires only when 0 or >=2 intent tables match (deterministic_match_count); a single unambiguous table hit never pays a model call."
      - "Upgrade-only fold: verdict confidence >= CLARITY_CONFIDENCE (0.65) may raise cognitive understanding confidence, never lower it."
      - "Steering: verdict confidence >= STEER_CONFIDENCE (0.85) with required tools appends '[intent routing hint: ...]' to the EXECUTION goal only; effective_goal stays clean for memory recall and Memora."
      - "Bounded + kill-switched: Settings.intent_classify_timeout wall-clock in a single-worker pool, LRU cache (256), FRIDAY_INTENT_CLASSIFIER=off prevents lazy CREATION (injected test doubles still returned) and tests/conftest.py defaults it on process-wide."
      - "route_request stays a pure function; fast_path exclusivity unchanged; compound requests never claimed by this tier."
      - "178 tests green: intent tier 14/14 + contract suites (word-boundaries 15, capability-routing 7, fast-path-scope 22, voice-instant 14, diagnostics 16, memory-commands 34, batch3-delegations 27, real-usage-battery 29) all passing with the tier enabled."
