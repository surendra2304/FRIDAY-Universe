  - id: TASK-REL-025
    title: "InvalidStateTransitionError race: concurrent turns drive the singleton agent's shared per-turn state machine and intermittently 500 /api/chat"
    status: VERIFIED
    owner: muse_ai
    branch: claude/task-rel-025-state-machine-race
    pr: 198
    contributors: []
    priority: P1
    created_at: "2026-11-14T23:00:00+05:30"
    updated_at: "2026-11-14T23:45:00+05:30"
    files:
      - "FRIDAY/src/friday/agent/agent.py"
      - "FRIDAY/src/friday/agent/state.py"
      - "FRIDAY/tests/test_rel025_state_machine_race.py"
      - "docs/collaboration/WORK_BOARD.yaml"
      - "docs/collaboration/ACTIVITY_LOG.md"
    claim_comment_url: "https://github.com/surendra2304/FRIDAY-Universe/issues/35#issuecomment-6881477072"
    defect: "FRIDAY's FridayAgent is a process-wide singleton (api/server.py module-level agent) whose turns run concurrently on executor threads (chat via run_in_executor, voice via asyncio.to_thread, plus scheduler/CLI callers). process_message stored each turn's ReasoningStateMachine in the shared instance attribute self.state_machine and replaced it at every turn start (agent/mixins/cognitive.py), so every in-flight turn's transitions landed on whichever machine was assigned most recently. The first turn to drive that machine to a terminal state (COMPLETED/FAILED/CANCELLED — no outgoing transitions) made every other in-flight turn's next transition_to raise InvalidStateTransitionError. _dispatch_command catches the raise into an execution_failed fallback dict, and execute_command maps execution_failed to HTTP 500 (chat_endpoint only rewraps 502s), so the race surfaced as intermittent /api/chat 500s. A turn abandoned by the asyncio.wait_for chat timeout keeps running as a zombie executor thread and corrupted the next turn the same way. Journal proof (Server 1, 2026-11-14): three raises, all COMPLETED->* — 20:29:53 ->UNDERSTANDING (REL-023 barrage window), 21:46:20 ->PLANNING with a POST /api/chat 500 at 21:46:22 (chat probe + voice greeting turn in flight together, Gemini pool exhausted), 21:52:57 ->VERIFYING."
    acceptance:
      - "Racing transition pair identified with journal + code evidence; deterministic reproduction of the production interleave before any fix."
      - "Root-cause fix: a turn only ever drives its own state machine (no shared mutable machine across turns); no catch-and-swallow of InvalidStateTransitionError at the API layer; the state machine's transition validation is unchanged."
      - "Regression tests that fail on clean main and pass with the fix, covering concurrent turns and an abandoned-timeout (zombie) turn; existing FRIDAY suites' failure sets unchanged vs clean-main baselines."
      - "Live proof on production after deploy: a parallel /api/chat barrage including delegations and client-abandoned slow turns, with zero InvalidStateTransitionError lines, zero cognitive-loop exceptions and zero chat 500s in the journal window, and the unified task timeline consistent (all barrage delegation records terminal with complete histories)."
    evidence:
      - "Claim: issue #35 comment 6881477072 (2026-11-14)."
      - "Journal forensics (Server 1 FRIDAY.service, 2026-11-14): 3 InvalidStateTransitionError raises (state-logger ERROR lines), every one COMPLETED->X. The 21:46:20 event is bracketed by two concurrent 'Processing user turn' lines (21:45:53 'What is the capital of Australia?...' chat probe; 21:46:02 'Greet the user warmly as FRIDAY...' voice-brain turn) and a 'POST /api/chat HTTP/1.1 500' access line at 21:46:22. Zero 'Exception in ASGI' lines all day — the 500 is execute_command's deliberate execution_failed mapping (api/server.py), not an unhandled crash."
      - "Reproduction (deterministic, pre-fix): the new tests park a cognitive turn inside a blocking execute_complex_task stub, run a greeting turn to COMPLETED on the same agent, then release the first turn — clean main raises InvalidStateTransitionError('Invalid state transition from COMPLETED to VERIFYING. Allowed target states: []'), the exact 21:52:57 production shape."
      - "Fix (PR #198, merge d64aaad75314a322dd400e3ba532a5f5ec5c9176): friday/agent/state.py gains a ContextVar binding (bind_turn_state_machine / current_turn_state_machine); FridayAgent.state_machine becomes a property resolving to the calling execution context's machine, with out-of-turn reads (current_state, status reporting) falling back to the most recently bound machine. Mixins unchanged — every existing self.state_machine call site now resolves per-turn. No exception is caught or hidden anywhere; ReasoningStateMachine validation untouched."
      - "Tests: FRIDAY/tests/test_rel025_state_machine_race.py — 4 tests (concurrent greeting-vs-cognitive interleave; abandoned zombie turn; simultaneous per-thread binding; sequential-turn guard). On clean main: 3 failed / 1 passed (the guard). With the fix: 4/4 pass. Regression rings vs clean main: test_agent.py 24 passed + 1 pre-existing failure (identical on both sides — test_agent_multi_turn_context_retention, a REL-022-era memory-behaviour drift unrelated to this change); a ring of 11 agent/chat/voice files: 98 passed + 1 pre-existing failure (identical on main); a ring of 11 further files: 202 passed / 1 skipped with the 6-failure set byte-identical to clean main."
      - "CI on PR #198 head 9f491b7639901f6a00768543b905237aac7bdff0: 6 success / 2 path-gated skipped / 0 failures (contracts, test, secrets scan, monorepo policy, fleet layout all green). All three shipped blobs verified byte-identical to the local worktree via git hash-object before the tree was built."
      - "Deploy: Fleet CD run 43623461450 (push d64aaad) completed success. Server 1 checkout d64aaad7; deployed blob hashes equal the merge commit's tree blobs (agent.py aede3f6792e1e41e52faa19406acb31b04f69325 — includes TASK-REL-027's sibling hunks from PR #196, merged cleanly and non-overlapping; state.py 71ff2e241bba2a3fe11732da3cfec49f6f97a425 — byte-identical to this task's shipped blob). FRIDAY.service active, restarted 2026-11-14 23:23:04 IST."
      - "LIVE BARRAGE (production /api/chat from Server 1 localhost, 2026-11-14 23:28:30 IST, 11-way concurrency, pool-strained evening conditions): 19 waited calls (6 greetings, 8 full cognitive turns, 5 delegations) = 18x HTTP 200, 1x HTTP 403 (del-futuris: Futuris's pre-existing honest-refusal mapping; the reply carried), 0x HTTP 500; plus 3 client-abandoned slow turns (Forge palindrome, Artemis research, long cognitive) whose server threads kept running as zombies amid the traffic. Journal for the window: 0 'Invalid state transition', 0 'Cognitive loop exception', 0 'POST /api/chat 500', 22 'POST /api/chat 200'."
      - "Timeline consistency (GET /api/tasks/timeline after settle): all 6 barrage delegation records terminal with complete 4-event histories — stratex completed; intelx solid-state batteries (waited) completed; intelx Artemis (ZOMBIE-originated) completed; forge palindrome (ZOMBIE-originated) recorded failed with its honest dispatch ReadTimeout error; sentinel and futuris recorded failed with their pre-existing honest peer-error reasons. No stuck, missing or corrupted records."
      - "Sibling-attribute note (recorded, out of scope): _processed_tool_ids / _processed_tool_signatures and task_context use the same per-turn-replaced shared-attribute pattern in process_message; they cannot raise this error (tool de-dup / context cross-talk at worst) and were deliberately left untouched to keep this fix minimal — a candidate for a future hardening pass."
    blockers: []
    next_action: "Done. VERIFIED 2026-11-14 (Muse, TASK-REL-025 crew): root cause fixed by turn-scoping the state machine (PR #198, merge d64aaad), deployed via Fleet CD run 43623461450 and fingerprint-verified on Server 1, production-proven with a 22-call parallel barrage (0 invalid-transition journal lines, 0 chat 500s, timeline fully consistent)."
