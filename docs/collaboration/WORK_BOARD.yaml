      - "FRIDAY/src/friday/llm/fallback_chain_provider.py"
      - "FRIDAY/src/friday/cognition/offline.py"
      - "FRIDAY/tests/test_rel_010_pool_exhaustion.py"
      - ".github/workflows/owner-workflows.yml"
    defect: "Live test round 2 (2026-11-14 17:01-17:20 IST): chat died with CREDENTIAL_EXHAUSTED minutes after a 16:50 verification showed 5/5 keys HEALTHY. Forensics (journal + pool state + direct per-key Google probes): PRIMARY is genuinely at its free-tier daily cap (Google verbatim: quotaId GenerateRequestsPerDayPerProjectPerModel-FreeTier, limit 20, value 20, retryDelay ~72200s), but FALLBACK 1-4 answer HTTP 200 on direct probe while the pool holds them benched until 2026-11-15 08:00 UTC. Cause chain: (1) one quota-classified 429 per key during a Google high-demand burst (a 503 model experiencing high demand opened the rotation) was enough to bench each key (max_failures=1), and report_failure honoured Google stated retry delay unboundedly (~20h to the daily reset); (2) with FRIDAY_LLM_PROVIDER=gemini the factory returns a bare GeminiLLMProvider - the FallbackChain exists only under provider=chain - so the owner designated text fallback (Groq) never engaged and every LLM-routed turn failed; (3) the offline no-model path (cognition/offline.py) runs tools whose schema declares no input property with empty arguments by design, so get_time_date lost the requested zone and answered IST for Tokyo/London/New York."
    acceptance:
      - "credential_pool: cooldowns capped at MAX_COOLDOWN_SECONDS=1800 for every failure category except AUTH_FAILED (report_failure, after honouring any Google-stated retry delay up to the cap); persisted cooldowns are clamped to the same ceiling on load, so a legacy state file cannot pin keys for ~20h across restarts."
      - "factory (provider=gemini): when a Groq credential is configured, the Gemini provider is wrapped in ExhaustionFailoverProvider - CREDENTIAL_EXHAUSTED delegates the call to a Groq provider built by the existing groq branch; all other errors propagate unchanged; without a Groq credential the bare Gemini provider is returned as before."
      - "offline path: when a tool declares a timezone property, _arguments_for extracts the zone the request names (explicit IANA token, else a curated place table, both ZoneInfo-validated) and passes it; no zone named, no argument."
      - "New tests FRIDAY/tests/test_rel_010_pool_exhaustion.py (12) cover the cap, the auth exception, the persisted-state clamp, failover semantics, factory wiring (with and without Groq), and offline timezone extraction; wired into the Owner Workflow Contracts CI list."
      - "Live acceptance after deploy: chat answers again on the recovered Gemini fallbacks, and with the pool state forced into the incident all-COOLDOWN shape, a plain chat question still returns a real answer via the Groq failover (journal-evidenced)."
    evidence:
      - "Recovered by Muse after the original agent ended without a report: fix found uncommitted on the Server-2 checkout, reviewed line-by-line, committed 15a8c156, shipped as PR #141, merged 68777bd5, Fleet CD deployed (Server 1 checkout verified to contain MAX_COOLDOWN_SECONDS / ExhaustionFailoverProvider / _PLACE_TIMEZONES; FRIDAY restarted 17:58:20 IST)."
      - "Tests: 12/12 new tests pass locally; 252 neighbouring FRIDAY tests pass (2 OpenAI-provider failures pre-existing on clean main); CI on PR #141 all green (contracts incl. the new test file, roster, fleet layout, monorepo policy, secrets; docker + voice-regressions path-gated skips)."
      - "Live failover proof: with the pool in the incident all-COOLDOWN shape after restart, journal 17:59:50 and 18:00:49 IST shows friday.llm.chain failing over to groq on CREDENTIAL_EXHAUSTED, and a plain chat question (capital of Australia) returned a real answer instead of dying; at 17:44 IST pre-fix the same question returned CREDENTIAL_EXHAUSTED while all five keys answered Google HTTP 200."
      - "Live recovery proof: persisted ~20h cooldowns were clamped to 1800s on load (state file: FALLBACK 2-4 cooldown_until = load+1800s, then DEGRADED/eligible); at 18:30 IST chat answered via provider=gemini (capital of France, success) with no restart and no failover line - the pool healed on schedule. PRIMARY and FALLBACK 1 re-benched for one capped 1800s window after failing at the expiry instant, as designed."
      - "Offline timezone fix is covered by unit tests (Tokyo/London/New York + explicit IANA + unknown place yields no argument); a live offline-path exercise would require both Gemini and Groq down simultaneously and was not forced on production."
    blockers: []
