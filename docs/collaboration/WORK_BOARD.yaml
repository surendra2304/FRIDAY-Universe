      falling back to the groq pipeline'' line belongs to a SECOND job (AJ_MQdbdfp3EdJo, room friday-efc331e0 — the round-3 browser task''s console voice click), whose own gather probes timed out and whose _try_gemini_realtime then ran a SECOND serial per-key probe round inline (escalating 3 s timeouts across 5 keys = up to ~95 s worst case) before falling back; that job greeted an empty room and logged ''job executor is unresponsive'' (event-loop stalls 703-814 ms). Shared root causes: (1) no verified-key cache — every job re-probes serially, so concurrent jobs multiply Gemini probe traffic exactly when the free tier is strained (503s + timeouts all evening); (2) brain-bridge tool calls budget 230 s, so a slow brain call wedges a voice turn indefinitely; (3) host CPU saturation at the moment of the wedge (FRIDAY logged ''CPU is running hot at 93.2%. Top offender: kswapd0'' at 20:36:03) with the worker''s event loop stalling; (4) no recovery path exists at all once a session wedges — the session
