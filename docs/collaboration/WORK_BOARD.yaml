  - id: TASK-REL-010
    title: "Gemini pool exhaustion: cap cooldowns, Groq failover on pool exhaustion, offline timezone loss"
    status: VERIFIED
    owner: muse_ai
    branch: claude/task-rel-010-pool-failover
    pr: 141
    contributors: []
    priority: P0
