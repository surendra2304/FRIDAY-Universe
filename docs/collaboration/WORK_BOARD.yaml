      - "FRIDAY/ui/components/VoiceCall.tsx"
    defect: "Owner report 'the voice is not working' persisted after TASK-VOICE-ROOM-001. Root cause found in the dispatch chain: /api/livekit/token minted a BARE RoomJoin token — LiveKit only dispatches a job to the worker via (a) a token-attached RoomConfiguration.agents dispatch, (b) an explicit AgentDispatchService call, or (c) a console dispatch rule. (c) never fired for the per-call rooms the dashboard mints (friday-<random>), so the worker sat at heartbeat 'registered / waiting for the first job' forever and the owner heard dead air. A misleading idle chip in the voice dock ('Voice backend: registered — waiting for the first job') amplified the broken impression."
    acceptance:
      - "Token endpoint attaches RoomConfiguration(agents=[RoomAgentDispatch(agent_name)]) to the token itself (the LiveKit template pattern) — joining a room deterministically dispatches the voice worker, independent of console rules."
      - "Capability fallback for older livekit-api: explicit agent_dispatch.create_dispatch via the server API; both paths degrade to the legacy bare token, never to an error."
      - "Worker registers under the matching agent_name (FRIDAY_VOICE_AGENT_NAME, default 'friday') so the dispatch reaches THIS worker."
      - "Idle heartbeat states no longer surface in the voice dock; only real failures (no-provider / error) are shown."
    evidence:
      - "SDK surface verified against livekit-api 1.2.2 / livekit-agents 1.8.11 in a clean venv before writing code (with_room_config, RoomConfiguration, RoomAgentDispatch, WorkerOptions.agent_name all present)."
      - "Post-deploy production token probe: /api/livekit/token?room=friday-test-* returns agent_dispatch=token-room-config and the decoded JWT carries roomConfig.agents=[{agentName: friday}]."
      - "Post-deploy Playwright E2E voice call on production (fake mic): tap Start voice -> line open at 3s -> audio track attached and PLAYING at 18s (t=2.29s) -> 'Live — speak naturally' at 23s -> orb 'Speaking' at 25s with 9.58s of audio played. connected=true, agent spoke=true, audio flowed=true, zero console errors."
