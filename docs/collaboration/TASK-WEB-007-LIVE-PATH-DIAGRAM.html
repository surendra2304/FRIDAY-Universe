<!doctype html>
<!-- diagram-design (FRIDAY adoption, TASK-IG2-WEB-01) — minimal-dark Architecture diagram.
     TASK-WEB-007 checkpoint 2: the live-path proof diagram (Diagram Design end-to-end use).
     Self-contained: inline SVG, no JavaScript, no external images.
     Geometry on the 4px grid; hairline borders; no shadows; accent on the focal nodes only.
     Type: Architecture. Budget check: 6 nodes, 5 arrows, 2 accent elements, 1 callout.
     Taste gate (§9) ledger: docs/collaboration/TASK-WEB-007-CHECKPOINT-2.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASK-WEB-007 — Three legs, one gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#030409; --paper-2:#0a0e1d; --ink:#eef1ff; --muted:#8b93b8; --soft:#5b6284;
    --rule:rgba(148,163,255,.18); --rule-solid:rgba(148,163,255,.35);
    --accent:#8f9bff; --accent-tint:rgba(99,102,241,.16); --link:#7dd3fc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;padding:40px 24px}
  .wrap{max-width:1000px;margin:0 auto}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;color:var(--muted);margin:0 0 8px}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:32px;margin:0 0 8px}
  .lede{color:var(--muted);font-size:15px;margin:0 0 28px;max-width:640px}
  .svg-scroll{overflow-x:auto}
  svg{display:block;min-width:1000px}
  .node-name{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;fill:var(--ink)}
  .node-sub{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;fill:var(--muted)}
  .tag{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;fill:var(--muted)}
  .arrow-label{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;fill:var(--muted)}
  .legend{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;fill:var(--muted)}
</style>
</head>
<body>
