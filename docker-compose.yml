version: "3.8"

# FRIDAY Universe — Full Stack Deployment
# Deploys all 10 agents + dashboard + Redis + persistence

services:
  # ── Infrastructure ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FRIDAY Core (Orchestrator) ────────────────────────────────────────────
  friday:
    build:
      context: .
      dockerfile: docker/Dockerfile.friday
    environment:
      - AGENT_NAME=friday
      - PORT=5000
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Inference ────────────────────────────────────────────────────────────
  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile.inference
    environment:
      - AGENT_NAME=inference
      - PORT=8005
    ports:
      - "8005:8005"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
