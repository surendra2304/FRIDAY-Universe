version: "3.8"

services:
  friday-universe-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-universe-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/FRIDAY-Universe/FRIDAY/apps/core/src:/app/FRIDAY-Universe/Inference/app:/app/FRIDAY-Universe/Inference:/app/FRIDAY-Universe/Memora:/app/FRIDAY-Universe/Stratex:/app/FRIDAY-Universe/Forge/app/services:/app/FRIDAY-Universe/Sentinel/app/services:/app/FRIDAY-Universe/IntelX/intelx/services:/app/FRIDAY-Universe/Futuris/futuris/core:/app/FRIDAY-Universe/VyralX/app/services
      - FRIDAY_UNIVERSE_VERSION=3.0.0
    volumes:
      - ./FRIDAY/.data:/app/FRIDAY-Universe/FRIDAY/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  friday-universe-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-universe-dashboard
    command: python3 -m http.server 3000 --directory FRIDAY/apps/core/src/friday_core/
    ports:
      - "3000:3000"
    volumes:
      - ./FRIDAY/apps/core/src/friday_core:/app/FRIDAY-Universe/FRIDAY/apps/core/src/friday_core
    depends_on:
      - friday-universe-api
    restart: unless-stopped

networks:
  friday-network:
    driver: bridge
