version: '3.8'

networks:
  friday_mesh:
    driver: bridge

services:
  # 1. Master Command Center & Gateway
  friday:
    build:
      context: ./FRIDAY
      dockerfile: Dockerfile
    container_name: friday_core
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - ./FRIDAY/.env
    environment:
      - PORT=10000
      - HOST=0.0.0.0
      - CORTEX_URL=http://cortex:8001
      - FORGE_URL=http://forge:8002
      - FUTURIS_URL=http://futuris:8003
      - INFERENCE_URL=http://inference:8004
      - INTELX_URL=http://intelx:8005
      - MEMORA_URL=http://memora:8006
      - SENTINEL_URL=http://sentinel:8007
      - STRATEX_URL=http://stratex:8008
      - VYRALX_URL=http://vyralx:8010
    networks:
      - friday_mesh

  # 2. Cortex
  cortex:
    build:
      context: ./Cortex
      dockerfile: Dockerfile
    container_name: friday_cortex
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./Cortex/.env
    networks:
      - friday_mesh

  # 3. Forge
  forge:
    build:
      context: ./Forge
      dockerfile: Dockerfile
    container_name: friday_forge
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./Forge/.env
    networks:
      - friday_mesh

  # 4. Futuris
  futuris:
    build:
      context: ./Futuris
      dockerfile: Dockerfile
    container_name: friday_futuris
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ./Futuris/.env
    networks:
      - friday_mesh

  # 5. Inference
  inference:
    build:
      context: ./Inference
      dockerfile: Dockerfile
    container_name: friday_inference
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - ./Inference/.env
    networks:
      - friday_mesh

  # 6. IntelX
  intelx:
    build:
      context: ./IntelX
      dockerfile: Dockerfile
    container_name: friday_intelx
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - ./IntelX/.env
    networks:
      - friday_mesh

  # 7. Memora
  memora:
    build:
      context: ./Memora
      dockerfile: Dockerfile
    container_name: friday_memora
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file:
      - ./Memora/.env
    networks:
      - friday_mesh

  # 8. Sentinel
  sentinel:
    build:
      context: ./Sentinel
      dockerfile: Dockerfile
    container_name: friday_sentinel
    restart: unless-stopped
    ports:
      - "8007:8007"
    env_file:
      - ./Sentinel/.env
    networks:
      - friday_mesh

  # 9. Stratex
  stratex:
    build:
      context: ./Stratex
      dockerfile: Dockerfile
    container_name: friday_stratex
    restart: unless-stopped
    ports:
      - "8008:8008"
    env_file:
      - ./Stratex/.env
    networks:
      - friday_mesh

  # 10. VyralX
  vyralx:
    build:
      context: ./VyralX
      dockerfile: Dockerfile
    container_name: friday_vyralx
    restart: unless-stopped
    ports:
      - "8010:8000"
    env_file:
      - ./VyralX/.env
    networks:
      - friday_mesh