[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-engine"
version = "0.1.0"
description = "FORGE: Autonomous Software Engineering Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Surendra", email = "surendra@forge.local" }
]
keywords = ["autonomous-agent", "software-engineering", "fastapi", "ai-agent", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# TASK-SEN-012 (2026-11-15): fleet-shared floors reconciled with SEN-002's live-venv probe; see docs/DEPENDENCY_LOCKS.md.
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "oracledb>=2.5.0",
    "httpx>=0.27.0",
    "redis>=5.0,<7.0",
    "python-dotenv>=1.2.4",
    "rich>=13.7.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "psutil>=5.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "aiosqlite>=0.22.1",
    "ruff>=0.3.0",
]

[project.scripts]
forge = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "forge_upgrade*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W291", "W292", "W293", "I"]
ignore = ["E501"]
